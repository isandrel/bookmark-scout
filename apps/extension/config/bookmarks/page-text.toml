# Page text search: the readable text of bookmarked pages, downloaded only when the user runs Index
# Page Text and kept on this device (src/lib/page-text-store.ts), so search finds words inside
# pages.

# Most characters kept per page, from its readable text
max_chars_per_page = 3000
# Most pages kept; indexing stops adding past it
max_pages = 10000
# Downloading one page
timeout_ms = 10000
# Bytes of one downloaded page, and characters of the current tab's page that Index this page's
# text reads in the popup
max_bytes = 2000000
# Pages downloaded at a time
concurrency = 4
# Raised when the kept text would read differently, so pages are indexed again. 2: plain text,
# one block per line ([text]), instead of Markdown
extractor_version = 2

# What is kept of a page: its readable text as plain text, one block per line, so a phrase search
# never matches across two paragraphs (src/services/page-reader.lazy.ts)
[text]
# Elements whose text is never kept: code, templates, what shows only without scripts, form
# fields (a hidden field keeps its value in an attribute, which is never read either), and
# hidden elements
drop = [
  "script", "style", "template", "noscript", "svg", "iframe", "object", "input", "textarea",
  "select", "option", "button", "[hidden]", "[aria-hidden=\"true\"]",
]
# Elements that start a block of their own
blocks = [
  "address", "article", "aside", "blockquote", "br", "caption", "dd", "details", "div", "dl",
  "dt", "fieldset", "figcaption", "figure", "footer", "form", "h1", "h2", "h3", "h4", "h5", "h6",
  "header", "hr", "legend", "li", "main", "nav", "ol", "p", "pre", "section", "summary", "table",
  "td", "th", "tr", "ul",
]

# Sign-in pages: a page that asks for a sign-in instead of showing what was bookmarked is listed
# on its own in the review and never saved as the page's text (src/services/page-text.ts).
[sign_in]
# Fields that ask for a password; a page with one of them in its main content may be a sign-in page
fields = ['input[type="password" i]', 'input[autocomplete~="current-password" i]']
# A field inside one of these is a box beside the content (a site header's sign-in), not the page
outside = ["header", "nav", "footer", "aside"]
# ...and it is a sign-in page only when its readable text is shorter than this: an article with a
# sign-in box, or with a newsletter form, keeps its text
max_text_chars = 1000
# Answers that mean the page needs a sign-in (Unauthorized, Forbidden); their pages are not read
http_statuses = [401, 403]
