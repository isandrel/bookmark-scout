# Capture Covers While Browsing (src/services/browse-covers.ts, Settings > Page Titles & Icons >
# Fetch Covers): when a bookmarked page finishes loading in the active tab of the focused window,
# the background takes a picture of the tab, shrinks it like any cover (config/bookmarks/covers.toml
# and the Cover Width setting), and keeps it on this device. Its wait, interval, and retake age are
# user settings ([covers] in config/settings/metadata-content.toml).

# The browser's own limit, in ms between two tabs.captureVisibleTab calls: Chrome refuses more
# than two a second (MAX_CAPTURE_VISIBLE_TAB_CALLS_PER_SECOND = 2). The Time Between Pictures
# setting's floor must stay above it (tests/unit/browse-covers.test.ts).
browser_min_interval_ms = 500
