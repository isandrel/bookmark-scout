# Smart rules: IF a bookmark matches a search, THEN add tags and move it to a folder
# (src/lib/bookmark-rules.ts).

# Most rules kept; later ones are dropped when read.
max_rules = 100
# Longest rule name, in characters
name_max_length = 80
# Longest rule id, in characters
id_max_length = 64
# Most tags one rule adds
max_tags = 10
# Longest tag a rule adds, in characters
tag_max_length = 50

# Starter rules Settings offers, added turned off. Each id has a name in every locale
# (TEMPLATE_NAME_KEYS in src/components/options/BookmarkRulesPanel.tsx).
[[templates]]
id = "github"
query = "domain:github.com"
add_tags = ["development"]

[[templates]]
id = "youtube"
query = "domain:youtube.com url:/watch"
add_tags = ["watch-later"]

[[templates]]
id = "tutorial"
query = "title:tutorial"
add_tags = ["learning"]

[auto_tag]
# Tag New Bookmarks: bookmarks added within this many milliseconds of each other are handled
# together, after the last one.
batch_window_ms = 2000
# A batch with more bookmarks than this (a sync, or an import from another program) is left alone.
max_batch = 20
