# Smart rules: IF a bookmark matches a search, THEN add tags and move it to a folder
# (src/lib/bookmark-rules.ts).

# Most rules kept; later ones are dropped when read.
max_rules = 100
# Longest rule name, in characters
name_max_length = 80
# Longest rule id, in characters
id_max_length = 64
# Most tags one rule adds
max_tags = 10
# Longest tag a rule adds, in characters
tag_max_length = 50

# Examples the rule editor shows in its empty Search and Test fields: a search and an address it
# matches. They are search syntax and an address, the same in every language.
[editor]
query_placeholder = "domain:github.com"
sample_placeholder = "https://github.com/acme/repo"

# Starter rules Settings offers, added turned off. Each id has a name in every locale
# (TEMPLATE_NAME_KEYS in src/components/options/BookmarkRulesPanel.tsx). A template adds tags
# (`add_tags`), moves (`move = true`), or both, and lists both keys. One that moves names no
# folder: folder ids differ on every browser profile, so the editor opens on it and asks for the
# folder before it can save.
[[templates]]
id = "github"
query = "domain:github.com"
add_tags = ["development"]
move = false

[[templates]]
id = "youtube"
query = "domain:youtube.com url:/watch"
add_tags = ["watch-later"]
move = false

[[templates]]
id = "tutorial"
query = "title:tutorial"
add_tags = ["learning"]
move = false

[[templates]]
id = "reading"
query = 'folder:"Work / Reading"'
add_tags = []
move = true

[automatic]
# Tag New Bookmarks and Move New Bookmarks (src/services/rule-automation.ts): bookmarks added
# within this many milliseconds of each other are handled together, after the last one.
batch_window_ms = 2000
# A batch with more bookmarks than this (a sync, or an import from another program) is left alone.
max_batch = 20
# Most recent automatic changes (taggings and moves) kept for Settings, each with its Undo; older
# ones are dropped.
log_max = 50

[runs]
# A reviewed run (Smart Rules in the Tools sidebar) is one entry in the same list, naming each
# bookmark it tagged so Undo there can take the tags back. Most bookmarks one entry names; tags a
# larger run added to the rest stay listed only as a count, and stay on Undo.
log_max_bookmarks = 5000
# Settings lists the bookmarks the last reviewed run found two rules disagreeing on (one would move
# it to one folder, another to a different one), each with a link to review it: at most this many,
# and the rest as a count (`rules.run-status`, src/lib/rule-run-status.ts).
conflicts_max = 20
