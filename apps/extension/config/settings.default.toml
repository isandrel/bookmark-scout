# Custom prompts (leave empty to use defaults)
# Users can edit in options page
[ai.custom_prompts]
# folder_recommendation = ""
# folder_reorganization = ""
# auto_tagging = ""
# summarization = ""

[export]
# Filename settings for exported bookmark files
filename_max_length = 50
filename_prefix     = "bookmarks_"

# Indentation settings (spaces)
html_indent_spaces     = 4
json_indent_size       = 2
markdown_indent_spaces = 2

# Default export options
include_dates_by_default = true
include_urls_by_default  = true

[context_menu]
# Enable right-click context menu for quick bookmark saving
enabled = true

# Source for bookmark title when saving via context menu
# Options: "link_text" (text of the link), "page_title" (title of the page), "link_url" (URL of the link)
bookmark_naming = "link_text"

[tools.ai_context_packer]
enabled             = true
default_scope       = "folder"
output_format       = "markdown"
include_folder_path = true
include_dates       = true
include_tags        = true
include_summaries   = true
max_items           = 200
max_depth           = 8
excerpt_length      = 240

[tools.auto_tagging]
enabled       = true
default_scope = "folder"
min_tags      = 2
max_tags      = 5
tag_style     = "kebab-case"
merge_mode    = "append"
dedupe_tags   = true

[tools.summarizer]
enabled             = true
default_scope       = "folder"
summary_length      = 160
include_domain_hint = true
merge_mode          = "replace"

[tools.reorganization]
enabled        = true
default_scope  = "folder"
dry_run_first  = true
min_confidence = 0.55
batch_size     = 100

[tools.duplicates]
enabled               = true
default_scope         = "all"
match_strategy        = "normalized_url"
normalize_www         = true
ignore_protocol       = true
ignore_trailing_slash = true
keep_rule             = "oldest"
max_groups            = 500

[tools.url_cleaner]
enabled = true
default_scope = "folder"
remove_hash = false
sort_query_params = true
dedupe_query_params = true
preserve_params = [ "id", "page", "q", "p", "lang" ]
remove_params = [
  "utm_source",
  "utm_medium",
  "utm_campaign",
  "utm_term",
  "utm_content",
  "utm_id",
  "gclid",
  "fbclid",
  "mc_cid",
  "mc_eid",
  "ref",
  "ref_src",
  "si",
]

[tools.dead_links]
enabled            = true
default_scope      = "folder"
request_timeout_ms = 8000
concurrency        = 4
retry_count        = 1
follow_redirects   = true
success_statuses   = [ 200, 201, 202, 204, 301, 302, 307, 308 ]

[tools.metadata_fetcher]
enabled            = true
default_scope      = "folder"
overwrite_titles   = false
fetch_favicons     = true
fetch_descriptions = true
request_timeout_ms = 8000
concurrency        = 4

[tools.privacy_scanner]
enabled = true
default_scope = "all"
scan_titles = false
scan_query_params = true
scan_fragments = true
sensitive_params = [
  "token",
  "access_token",
  "refresh_token",
  "auth",
  "authorization",
  "api_key",
  "apikey",
  "key",
  "secret",
  "password",
  "pwd",
  "code",
  "session",
]
email_detection = true
uuid_detection = true

[tools.statistics]
enabled                 = true
default_scope           = "folder"
include_domains         = true
include_folders         = true
include_duplicates      = true
include_protocols       = true
include_depth_breakdown = true
top_n                   = 10

[tools.data]
show_export           = true
show_import           = true
default_export_format = "html"
