# The bookmark manager table. Read by src/components/ui/table/table-config.ts.

# Rows per page offered under the table; the saved view must use one of them. The table renders
# every row of a page, so a larger default costs time per search keystroke: 50 instead of 10 took
# manager.filter.keystroke from 136 to 280 ms (tests/perf, 4x CPU throttle; budget 400)
page_sizes = [10, 20, 30, 40, 50, 100]
default_page_size = 50

# The columns a new table view shows, in this order, by column id. Every other column stays in the
# View menu, hidden, after these; the checkbox column stays first and the row menu last. A saved
# view keeps the user's own columns and order.
default_columns = ["title", "url", "dateAdded"]

# Column widths are saved to sync storage, which limits writes per minute, so a width is saved
# once resizing has stopped for this long, in milliseconds
column_sizing_save_delay_ms = 400

# When the focused row is deleted or moved away, focus goes to the next row once nothing else
# holds it. A confirmation dialog gives focus back as it closes, which can be after the row is
# gone, so the table waits this long, in milliseconds, for focus to come back from it
removed_row_focus_wait_ms = 1500

# Months shown side by side in the Date Added filter's calendar
date_filter_months = { value = 2, min = 1, max = 12 }

# A filter button names up to this many selected options; more are shown as a count
facet_badges_max = 2

# Column widths in pixels, by column id (src/components/ui/table/columns.tsx). `size` is the
# starting width and `min_size` the narrowest a user can resize it to; a `fixed` column never
# resizes. `hide_below_width` hides the column while the table is narrower than that, in pixels.
# `fill` columns share the room the other columns leave, in proportion to their `fill`, until the
# user sizes them; their `size` is then the narrowest they fill to, not a fixed width.
[columns]
select = { fixed = 40 }
type = { size = 120, min_size = 70 }
id = { size = 100, min_size = 60 }
parentId = { size = 180, min_size = 80 }
folderPath = { size = 180, min_size = 80, hide_below_width = 960 }
# Title and URL share the spare width, Title a bit more (3:2), so neither one takes the whole
# table on a wide window while the dates stay compact at the end
url = { size = 200, min_size = 80, fill = 2, hide_below_width = 880 }
title = { size = 160, min_size = 120, fill = 3 }
# Fits a date and time ("12/28/2026, 12:23:31 PM", or a little longer in other languages) beside
# the cell padding
dateAdded = { size = 184, min_size = 100 }
dateGroupModified = { size = 184, min_size = 100 }
unmodifiable = { size = 130, min_size = 80 }
# The four move buttons (24px each) and the row menu, side by side with the cell padding, so the
# buttons shown on hover have their own room and never cover the columns before them
actions = { fixed = 140 }
