# Quick save shortcuts: the notification shown in the page after a save. Where the page goes is
# the user's quick save settings (config/settings/search.toml); how folders are ranked is
# config/bookmarks/folder-ranking.toml. Read by src/services/quick-save.ts.

# How many of the folders the notification offers (Alternatives in Settings) may be recently used
# folders, offered only when fewer folders match the
# page. They say nothing about the page, so they come after every match.
recent_alternatives = { value = 1, min = 0, max = 8 }
# After drawing it, the notification checks it is really on screen: inside the viewport (give or
# take this many CSS pixels, for rounding on zoomed pages) and not covered at its center. When it
# is not, it removes itself and the badge and popup show the result instead.
visible_tolerance_px = { value = 2, min = 0, max = 64 }
# On pages the extension cannot show the notification in (browser pages, the store, PDF viewer),
# the toolbar badge shows the result for this many milliseconds, and the popup shows the last
# quick save with Undo for this long after it happened.
badge_clear_ms = { value = 4000, min = 500, max = 60_000 }
popup_result_max_age_ms = { value = 300000, min = 1000, max = 3_600_000 }
# Save a Cover With Quick Save takes its picture of the tab before the notification is drawn, so
# the notification is never in it; the notification waits at most this long for it. A picture that
# takes longer is not kept.
cover_picture_wait_ms = { value = 1500, min = 100, max = 10_000 }
# When quick save replaces a bookmark's cover (When the Bookmark Already Has a Cover: Replace), the
# last quick save keeps the replaced cover in session storage, so Remove cover can put it back. A
# cover larger than this many KB (a stored cover is a shrunk copy, usually far smaller) is not kept,
# and Remove cover then leaves the bookmark without one.
replaced_cover_max_kb = { value = 512, min = 64, max = 2048 }
# Badge text and background per result. Colors are the DESIGN.md success and danger tokens.
badge_success_text = "✓"
badge_failure_text = "✗"
badge_success_color = "#1d7a4a"
badge_failure_color = "#b42318"
