# Ways the extension shows dates and times: the choices of Settings > Appearance > Dates and
# Times. Read by src/lib/date-formats.ts. Each format is a set of Intl.DateTimeFormat options in
# snake_case, so a new one is a new table here plus its label message (`label`, in every
# language). `locale` pins the order for a format that must not follow the extension's language.
# The setting's default choice is in config/settings/appearance.toml.

# The parts every time shows besides its hour (each time format sets `hour`); `second` only
# where a date and time show together. A date written with `date_style` takes `time_style`
# instead, which cannot be mixed with single parts.
# The date each choice shows as its sample in Settings: an afternoon, so it shows how dates are
# ordered and 12- or 24-hour times. A local time, with no time zone.
sample = "2026-03-14T15:09:26"

[time_parts]
minute = "2-digit"
second = "2-digit"
time_style = "medium"

[date_formats.auto]
label = "settings_dateFormatAuto"
year = "numeric"
month = "numeric"
day = "numeric"

[date_formats.short]
label = "settings_dateFormatShort"
date_style = "short"

[date_formats.long]
label = "settings_dateFormatLong"
date_style = "long"

[date_formats.iso]
label = "settings_dateFormatIso"
locale = "sv-SE"
year = "numeric"
month = "2-digit"
day = "2-digit"

[time_formats.auto]
label = "settings_timeFormatAuto"
hour = "numeric"

[time_formats.hours12]
label = "settings_timeFormatHours12"
hour = "numeric"
hour_cycle = "h12"

[time_formats.hours24]
label = "settings_timeFormatHours24"
# Two digits, so every time lines up (05:51, not 5:51).
hour = "2-digit"
hour_cycle = "h23"
