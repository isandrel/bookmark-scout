# Keyboard shortcuts: every key Bookmark Scout uses or names is defined here, once. The extension
# reads this file in src/lib/keyboard-shortcuts.ts, and the manifest build, docs, website, and
# README generator read it through `readShortcutConfig` in @bookmark-scout/config, whose
# packages/config/src/shortcuts.ts also formats keys for every surface. Never type a shortcut by
# hand in the docs, website, store listings, or README.
#
# In [manager] and [popup], each action lists one or more bindings: `key` is the
# KeyboardEvent.key value ("/", "j", "ArrowUp", "Backspace"), with optional `alt` and `shift`.
# Shortcuts pause while typing, during IME composition, and while a dialog or menu is open. The
# manager's shortcuts help and the popup's shortcuts tooltip list these same bindings.
#
# The popup and side panel never use Ctrl or Cmd, so browser shortcuts keep working there. The
# bookmark manager replaces the browser's own manager, so it also takes that manager's Ctrl
# shortcuts: `mod = true` is Ctrl, or Cmd on a Mac. A manager binding can apply to one platform
# only, `platform = "mac"` or `"other"`, as Chrome's manager does (F2 renames elsewhere, Enter on a
# Mac).
#
# Not listed: the keys of the standard ARIA patterns, which every tree, table, list, and combobox
# answers the same way and which are not configurable (arrow keys, Home, End, Enter, Space, Tab,
# and Escape; TREE_KEY_BINDINGS in src/lib/keyboard-shortcuts.ts).

# Text that names both platforms' keys (the docs before they know the reader's computer, the
# website, the READMEs, the store listings) prints the `primary` platform's keys first and the
# other platform's after them in parentheses, each labelled, all at the same size: "⌥⇧S on Mac
# (Alt+Shift+S on Windows and Linux)". "mac" or "other" (Windows, Linux, and ChromeOS). Pages that know the reader's platform, such as the
# extension's own, show only that platform's keys.
[display]
primary = "mac"

# The extension's browser commands (`manifest.commands`), by command name, with the keys the
# manifest suggests, in the browser's command format (MDN `commands`: up to two of Ctrl, Alt,
# Command, MacCtrl, and Shift, then one key; `Ctrl` is Command on a Mac). The browser keeps the keys
# the user picks; Options shows them from `commands.getAll()`. src/lib/command-catalog.ts lists
# the same commands. Suggested keys avoid every built-in shortcut of Chrome, Edge, and Firefox.
[commands]
quick-save = "Alt+Shift+S"
ai-quick-save = "Alt+Shift+D"

# The browser's own keys that the extension acts on or the docs name, in the same format. A value
# can differ per platform: { other = "...", mac = "..." }.
[browser]
# Bookmark this page. No browser lets an extension take it as a default; in Chrome and Edge the
# user can give it to quick save on the browser's shortcut page.
bookmark_page = "Ctrl+D"
# Bookmark all tabs. Firefox keeps this key and bookmark_page for itself, even when an extension
# sets them, so the Firefox shortcut recorder refuses both.
bookmark_all_tabs = "Ctrl+Shift+D"
# The browser's bookmarks page, which Bookmark Scout replaces in Chrome
open_bookmarks_manager = { other = "Ctrl+Shift+O", mac = "Alt+Command+B" }
# Opens the right-click menu of the focused row or folder, like the menu key
context_menu = "Shift+F10"

# Bookmark manager page.
[manager]
focus_filter = [{ key = "/" }]
show_help = [{ key = "?" }]
parent_folder = [{ key = "ArrowUp", alt = true }, { key = "Backspace" }]
next_row = [{ key = "j" }]
previous_row = [{ key = "k" }]
open_saved_searches = [{ key = "s" }]
# Preview the focused bookmark (its cover, folder, tags, and summary) in a dialog. Space is the grid's
# select key, so preview takes a letter, as saved searches does
preview = [{ key = "p" }]
# The rows the filters show, on every page of the table
select_all = [{ key = "a", mod = true }]
clear_selection = [{ key = "Escape" }]
# Backspace alone goes to the parent folder, so a Mac deletes with Cmd+Backspace (as in Finder)
delete = [{ key = "Delete" }, { key = "Backspace", mod = true, platform = "mac" }]
rename = [{ key = "F2", platform = "other" }, { key = "Enter", platform = "mac" }]
# A folder opens in the manager; bookmarks open in tabs, the first in front
open = [{ key = "Enter", platform = "other" }, { key = "o", mod = true, platform = "mac" }]
open_in_new_tabs = [{ key = "Enter", mod = true }]
open_in_new_window = [{ key = "Enter", shift = true }]
undo = [{ key = "z", mod = true }]
redo = [
  { key = "y", mod = true, platform = "other" },
  { key = "z", mod = true, shift = true },
]
# The browser's copy, cut, and paste keys: the manager acts on its clipboard events, so these
# are what the shortcuts help and the docs show, not keys the manager listens for
copy = [{ key = "c", mod = true }]
cut = [{ key = "x", mod = true }]
paste = [{ key = "v", mod = true }]

# Mouse gestures the manager answers or the docs name: `key = "click"` with the same modifiers
# as keys (`mod` is Ctrl, or Cmd on a Mac). Text names them "⌘-click" on a Mac (as Apple writes
# them) and "Ctrl+click" elsewhere, the word for the click in each language.
[mouse]
# Adds a row to the selection or takes it out, in the manager's table and folder tree
select_toggle = [{ key = "click", mod = true }]
# Selects every row from the last one clicked to this one
select_range = [{ key = "click", shift = true }]
# The browser's own: opens a link in a new background tab
open_in_background = [{ key = "click", mod = true }]

# Popup and side panel.
[popup]
focus_search = [{ key = "/" }]
# Show recent searches from the empty search box (the combobox pattern's Alt+ArrowDown), so a
# plain ArrowDown always reaches the tree
recent_searches = [{ key = "ArrowDown", alt = true }]
