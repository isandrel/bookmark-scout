# The search row at the top of the popup and side panel. Read by
# src/components/bookmark/BookmarkSearch.tsx.

# Narrowest room, in pixels, left for typing in the search box beside its own buttons (Search
# options, Clear). When the row is too narrow for that next to every button it may show
# (with AI on and a search typed), the buttons move to a second row below the search box. The
# check counts buttons that are not shown yet, so the layout does not jump while typing.
min_text_width_px = { value = 72, min = 16, max = 400 }

# Space between the typed text and the buttons inside the search box, in pixels
controls_gap_px = { value = 4, min = 0, max = 32 }
