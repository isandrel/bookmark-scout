# Drag and drop of bookmarks: the popup and side panel tree (src/components/bookmark/tree-drop.ts)
# and the manager's table and folder tree (src/lib/bookmark-drop.ts). Read by
# src/lib/bookmark-drop.ts. Fractions are of a row's height, measured from its top.

# A drop this close to a folder row's top or bottom edge reorders beside the folder; a drop
# between the two bands moves the item into the folder
folder_edge_fraction = { value = 0.25, min = 0.05, max = 0.5 }

# A drop above this point of a bookmark row goes before it, and below it goes after it
bookmark_split_fraction = 0.5

# Where a drop counts when the row has no height to measure, or the drag event has no position
# inside it: the row's middle
unmeasured_fraction = 0.5

# Milliseconds a drag must hover over a closed folder in the manager's folder tree before it opens
manager_auto_expand_ms = 700
