# "Save to folder" matches at the top of popup and side panel search results. Read by
# src/lib/folder-match.ts. Whether they show, how many, and the weight of each part of a folder are
# user settings (config/settings/search.toml, [folder_matches]); how words match is Search Matching.

# Extra rank for a folder you saved to recently: the most recent folder's score grows by this share,
# and each older one by a step less, so recent folders win ties between equally good matches.
recent_boost = { value = 0.5, min = 0, max = 5 }

# Largest share of the popup's height the matches may take, from 0 to 1. More matches scroll
# inside the list, so the bookmark tree below stays usable.
max_height_fraction = 0.3
