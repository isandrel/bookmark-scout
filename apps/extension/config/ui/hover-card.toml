# The bookmark hover card: a bookmark's details (address, folder, tags, summary, cover, date added)
# where the pointer rests on its row in the popup and side panel (Show Details on Hover), or on a
# summary the manager's Summary column cuts short. Read by src/lib/hover-card.ts.

# How long the pointer rests on a row, or keyboard focus stays on it, before the card opens, in
# milliseconds; moving down a list never flashes cards
open_delay_ms = 600
# How long the card stays once the pointer has left both the row and the card, in milliseconds;
# long enough to cross from the row onto the card
close_delay_ms = 150

# The card's widest width, in pixels; in a narrower window it takes the width less `edge_gap_px`
# on each side
max_width_px = 360
# Room between the card and the window's edges, in pixels
edge_gap_px = 8
# Room between the card and its row, in pixels; the close delay covers crossing it
row_gap_px = 4

# The summary shows whole, scrolling inside the card once it is taller than this, in pixels
summary_max_height_px = 160
# Tag chips shown before one "+N" chip names the rest
max_tags = 8
# The stored cover's thumbnail beside the title, in pixels wide (at the cover ratio of
# config/ui/manager-table.toml); without a stored cover the room is not kept
cover_width_px = 96

# The manager list's Cover column shows its thumbnail's cover larger in a card of its own, opened
# and closed like this card (`open_delay_ms`, `close_delay_ms`): the cover at most this many
# pixels wide, never wider than the stored image, then the title and where the cover came from
cover_preview_max_width_px = 480
