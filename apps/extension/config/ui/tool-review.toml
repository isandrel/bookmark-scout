# The review list every tool's review uses: category tabs, selection, batch actions, and rows
# drawn only while on screen. Read by src/components/bookmarks/review/ReviewList.tsx.

# A row's height before it is measured, in pixels
row_estimate_px = 72
# Rows drawn above and below the ones on screen
overscan_rows = 6

# What a tool's review starts each item on until the user picks another: URL Cleaner "clean" or
# "keep"; Metadata Fetcher "apply" or "skip" for the titles it can change (the rest are skipped);
# Refresh Site Icons "save" or "skip" for the icons it found; Auto-Tagging and Summarizer "save" or
# "skip" for each suggestion; Privacy Scanner "keep" or "delete" for each bookmark it flags.
[defaults]
url_cleaner = "clean"
metadata_fetcher = "apply"
site_icons = "save"
ai_metadata = "save"
privacy_scanner = "keep"
