# Toast notifications. How long a toast stays open is the user's toast_duration_ms setting, and
# how long a quoted bookmark title may grow is the truncate_length setting (both in
# config/settings/appearance.toml); these values are fixed.

# Milliseconds a dismissed toast stays mounted, and how long its exit animation runs
# (src/components/ui/toast.tsx), so the animation always finishes.
remove_delay_ms = 500

# While a dialog is open, the toast stack keeps clear of it without leaving its Toast Position
# corner or edge sideways (src/lib/toast-dialog-clearance.ts): of the whole dialog when the stack
# fits above or below it, and otherwise of the dialog's action areas (its footer and every
# DialogActions row). Pixels left between the dialog or an action area and the stack.
dialog_gap_px = { value = 8, min = 0, max = 64 }
