# The bookmark manager's address (`?id=<folder>&q=<search>`). Read by src/lib/manager-url.ts.

# While the search changes, a change within this many milliseconds of the previous one replaces
# the history entry instead of adding one, so a burst of typing is one Back step. Chrome's own
# manager uses 200.
search_history_dwell_ms = 200

# What "Copy link to this folder" copies, by browser build: the address of the browser's own
# bookmark manager, which this page replaces there, followed by `?id=<folder>`. A browser without
# an entry (Firefox, where the page cannot replace the browser's manager) copies the extension
# page's own address instead.
[folder_link_base]
chrome = "chrome://bookmarks/"
edge = "edge://favorites/"
