# Options page. Read by src/components/page/OptionsPage.tsx.

# Milliseconds after the last edit before changed settings are saved.
autosave_delay_ms = 400

# Settings named in the toast after an import; the rest are counted as "and N more".
import_change_preview_limit = 5

# Category shown when the page opens: "essentials" (the few settings most people change,
# config/ui/essentials.toml) or a key of the settings categories in lib/settings-schema.ts.
# `options.html?category=<key>` opens another one.
default_category = "essentials"

# File name of a backup (Export): settings, prompts, AI services with their endpoints but without
# their API keys and extra headers, and saved searches.
backup_filename = "bookmark-scout-backup.json"

# Milliseconds the notice after restoring a backup stays up when it lists AI services whose API
# keys or extra headers must be entered again; it is longer than a usual notice.
restore_notice_duration_ms = 15000
