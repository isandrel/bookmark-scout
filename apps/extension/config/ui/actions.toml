# Which bookmark actions each bookmark manager menu shows, by section (menus put a separator
# between sections), in order. Ids are entries of the action registry (src/services/actions.ts);
# an action appears only where it is available for the items clicked. Read by
# src/services/action-menus.ts, which fails at load on an unknown id or one with no entry for
# that kind of menu.

[menus]
# A row's ⋯ menu, the right-click menu on rows (acting on the selection), and on tree folders
item = [
  ["preview", "showInFolder", "edit", "viewDetails"],
  ["cut", "copy", "paste", "copyFolderLink", "copyId"],
  ["openInNewTab", "openInNewWindow", "openInPrivateWindow"],
  ["delete"],
]
# The header's ⋮ Organize menu, on the folder shown
organize = [["sortByName"], ["addBookmark", "addFolder"]]
# The right-click menu on the table's empty space, on the folder shown
empty_space = [["addBookmark", "addFolder"], ["paste"]]
# The buttons of a bookmark's preview (opened from the item menu or the manager's preview key), on
# the bookmark it shows. Open is the manager's Open: a new tab in front, as Enter does.
preview = [["openInNewTab"], ["copy", "edit"]]

[item_menu]
# Options > Behavior > Bookmark manager menus keeps at least one of these shown, so the item menu
# always has a command for any one bookmark or folder. Each must be available for any single item
# (tests/unit/action-menus.test.ts checks it).
keep_one_of = ["viewDetails", "copyId"]
