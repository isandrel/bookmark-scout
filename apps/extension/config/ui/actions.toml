# Which bookmark actions each bookmark manager menu shows, by section (menus put a separator
# between sections), in order. Ids are entries of the action registry (src/services/actions.ts);
# an action appears only where it is available for the items clicked. Read by
# src/services/action-menus.ts, which fails at load on an unknown id or one with no entry for
# that kind of menu.

[menus]
# A row's ⋯ menu, the right-click menu on rows (acting on the selection), and on tree folders
item = [
  ["preview", "showInFolder", "edit", "viewDetails"],
  ["cut", "copy", "paste", "copyFolderLink", "copyId"],
  ["openInNewTab", "openInNewWindow", "openInPrivateWindow"],
  ["fetchCover", "removeCover", "delete"],
]
# The header's ⋮ Organize menu, on the folder shown
organize = [["sortByName"], ["addBookmark", "addFolder"]]
# The right-click menu on the table's empty space, on the folder shown
empty_space = [["addBookmark", "addFolder"], ["paste"]]
# The buttons of a bookmark's preview (opened from the item menu or the manager's preview key), on
# the bookmark it shows. Open is the manager's Open: a new tab in front, as Enter does.
preview = [["openInNewTab"], ["copy", "edit"]]

[item_menu_0_3_4]
# An item menu the user arranged in 0.3.4 (stored with no section marks) names only the actions it
# shows, so an action it leaves out was hidden, except these, which the item menu gained after
# 0.3.4: they show until the user hides them. Menus stored since name hidden actions too
# (src/lib/shown-ids.ts), but an item menu 0.3.4 stored keeps its form until the user changes the
# menu, so every action the item menu gains later needs an entry here as well
# (tests/unit/upgrade-from-0.3.4.test.ts fails without one).
added_since = ["preview", "fetchCover", "removeCover"]

[keep_one_of]
# Options > Behavior > Bookmark manager menus keeps at least one of these shown in the menu they
# are listed for, so the item menu always has a command for any one bookmark or folder. Each must be
# available for any single item (tests/unit/action-menus.test.ts checks it). Every menu also keeps
# at least one action of any kind.
item = ["viewDetails", "copyId"]
