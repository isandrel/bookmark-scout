# Reading web pages for the network tools (Metadata Fetcher, Refresh Site Icons, Index Page Text,
# Fetch Covers, AI page reading). Read by src/services/bookmark-network-tools.ts.

# Bytes read from one page at most when only its <head> is needed (titles, descriptions, icon
# links); reading stops earlier at the end of the <head>
head_max_bytes = 524288
# Characters of the previous chunk kept when looking for the end of the <head>, so a closing tag
# split across two chunks is still found
stop_pattern_overlap_chars = 16
# Bytes at the start of a page searched for a <meta charset> when the server names no charset. HTML
# requires it within the first 1024 bytes; twice that tolerates sloppy pages.
charset_sniff_bytes = { value = 2048, min = 1024, max = 65536 }
# A read that checks each address before requesting it (Index Page Text, Fetch Covers, AI page
# reading) follows at most this many redirects whose target it can read, then stops and reports
# the page as redirected. Browsers hide the target of a redirect from extensions, so there such a
# read stops at the first redirect whatever this says.
max_redirects = { value = 5, min = 0, max = 20 }
# When a redirect's target is hidden, the likely targets tried first, at most this many requests:
# the page's https: address, then its host with www. added or removed (same registrable domain).
# Each is checked like any address before it is requested and is read only when it answers with a
# page itself; one that redirects again is not followed. 0 turns guessing off, so every redirect
# is reported as redirected.
redirect_guesses = { value = 3, min = 0, max = 6 }
