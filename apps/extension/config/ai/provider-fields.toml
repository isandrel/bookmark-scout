# Example values shown as placeholders in the AI service editor (Options > AI). Read by
# src/components/options/AIServiceEditor.tsx. The API key placeholder is the provider's own key
# format, `api_key_placeholder` in config/ai/providers/<id>.toml (such as "sk-...", never prose,
# which would not be translated); without one it is a localized "Required" or "Optional", from the
# provider's `requires_api_key`. The endpoint placeholder is the provider's own endpoint when it
# has one.

base_url = "https://api.example.com/v1"
extra_headers = '{"HTTP-Referer":"https://example.com"}'

# Provider-specific connection fields, by field id (`extra_fields` in a provider file)
[extra_fields]
organization = "org-..."
project = "proj_..."
resourceName = "my-resource"
apiVersion = "v1"
