# CLIProxyAPI serves your own Claude, Gemini, and Codex accounts as an OpenAI-compatible API on
# this machine. Its default config requires one of the keys under `api-keys` in config.yaml.
name = "CLIProxyAPI"
order = 190
default_model = "gpt-4o-mini"
provider_kind = "openai_compatible"
requires_api_key = false
api_key_placeholder = "Key from api-keys in config.yaml"
base_url = "http://localhost:8317/v1"
supports_custom_model = true
group = "local"

[[models]]
id = "gpt-4o-mini"
name = "GPT-4o Mini"
description = "OpenAI-compatible route"

[[models]]
id = "claude-sonnet-4"
name = "Claude Sonnet 4"
description = "Claude route via CLIProxyAPI"

[[models]]
id = "gemini-2.5-pro"
name = "Gemini 2.5 Pro"
description = "Gemini route via CLIProxyAPI"
