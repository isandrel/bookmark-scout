# Azure lists base models, not your deployments, so there is no model list: enter the deployment
# name as the custom model.
name = "Azure OpenAI"
order = 80
default_model = "gpt-4o-mini"
provider_kind = "native"
requires_api_key = true
supports_custom_model = true
model_list = "none"
extra_fields = ["resourceName", "apiVersion"]
# The endpoint without a Base URL, from the Resource name field.
resource_url_template = "https://{resourceName}.openai.azure.com/openai/v1"
logo = "azure"

[[models]]
id = "gpt-4o-mini"
name = "gpt-4o-mini (deployment name)"
