# Ask AI's kept chats (Settings > AI > Ask AI > Keep Chats). Read by src/lib/ask-ai-chats.ts; how many
# chats are kept is the user's setting (config/settings/ai.toml, chats_max).

# Characters of the first question a chat is named by in the list of chats
title_chars = { value = 60, min = 10, max = 200 }
# How often, in milliseconds, a chat is kept while an answer is still being written, so closing
# the popup mid-answer loses at most this much of it; a finished answer is kept at once
save_interval_ms = { value = 1000, min = 250, max = 10000 }
# Messages kept per chat at most, the oldest dropped first, so one long chat cannot fill the
# device's storage
max_messages = { value = 200, min = 10, max = 1000 }
