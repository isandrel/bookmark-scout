# How much text and how many items the extension accepts in fields that come from outside it
# (AI agents and models, web pages, the local bridge program) or that it stores, and how long the
# ids it makes are. Read by src/lib/input-limits.ts.

# Longest text, in characters.
[chars]
# A title an agent gives when it saves a page, renames an item, or creates a folder.
bookmark_title = 500
# The one-sentence summary of an agent's plan.
plan_summary = 200
# A folder id stored in a setting.
folder_id = 200
# The browser's reason the local bridge program stopped.
agent_bridge_status_detail = 500
# An agent's own name, and an error code or reason, in a History record.
audit_actor_label = 200
audit_error_code = 64
audit_reason = 64
# The backup file's name and a backup part's id in a History record of an import.
audit_file_name = 255
audit_part_id = 64
# Ids, feature names, and the page's token in quick save messages.
message_id = 100
message_source = 50
# The HTTP method of a request the AI host page asks the background to make, and the language tag
# of a generation request.
request_method = 10
locale_tag = 10
document_token = 100
# A page's <head> the background hands the AI host page to read; the same as head_max_bytes
# in config/network/html.toml, which a unit test checks.
page_head = 524288
# A whole page the background hands the AI host page to read for Index Page Text; the same as
# max_bytes in config/bookmarks/page-text.toml, which a unit test checks.
page_html = 2000000
# The text on the toolbar button's badge, which the browser fits in about four characters.
action_badge = 4
# A preview image address a page names in a meta tag, read by quick save from the tab.
cover_meta = 4096

# Most items.
[counts]
audit_error_codes = 20
# Backup parts one History record of an import lists.
audit_parts = 32
# The highest position of an alternative folder a quick save toast can pick.
alternative_index = 50
request_headers = 100
# Meta tags naming a preview image that quick save reads from a page.
cover_metas = 20
# The most folder ids a quick save folder answer may choose from: the largest `candidates` shortlist
# allowed in config/ai/built-in.toml, which a unit test checks.
host_choices = 100

# Lengths of the ids the extension makes.
[ids]
# Random bytes of the token a page's quick save toast identifies itself with.
document_token_bytes = 16
# Characters of a random id after the provider's name in an AI service id.
service_suffix = 8
# Characters of a saved prompt's id.
prompt = 12
