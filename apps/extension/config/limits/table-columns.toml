# Resizable columns in the bookmark manager table. Read by src/lib/bookmark-table-column-sizes.ts.
# Each column's default and minimum width is in [columns] of config/ui/manager-table.toml.

# Widest a resizable column may be dragged, in pixels.
max_column_width = 1200

# Pixels one ArrowLeft or ArrowRight press on a column resize handle changes the width by.
column_resize_step = 10
