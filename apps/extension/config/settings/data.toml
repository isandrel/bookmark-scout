# Defaults for Options > Import & Export, one table per section.

[tools]
# Import and export tool cards in the Tools sidebar
show_export = true
show_import = true

[export]
# Format selected when the export tool opens: "html", "json", "markdown", or "csv"
default_format = "html"
# Default export options
include_dates = true
include_urls = true
# Filename settings for exported bookmark files
filename_prefix = { default = "bookmarks_", min_length = 0, max_length = 50 }
filename_max_length = { default = 50, min = 10, max = 100, step = 5 }
# Indentation settings (spaces)
json_indent_size = { default = 2, min = 1, max = 8, step = 1 }
html_indent_spaces = { default = 4, min = 1, max = 8, step = 1 }
markdown_indent_spaces = { default = 2, min = 1, max = 8, step = 1 }

[backup]
# Parts in New Backups: the parts Back up settings starts with selected, as ids from
# `[[categories]]` in config/data/backup.toml; every save stores the parts chosen, so the dialog
# remembers them on this device. Neither this device's settings (they suit one computer, like VS
# Code's machine settings) nor the AI service keys (never preselected, never remembered) can be in
# the default; tests/unit/backup-categories.test.ts checks it. Covers are in: the backup is how they
# reach a new computer, and the dialog says their size before saving.
parts = { default = ["settings", "views", "prompts", "rules", "aiServices", "covers"], max_items = 7, max_length = 14 }
# Protect New Backups With a Password: whether "Protect this backup with a password" starts
# checked for every backup. Off: most backups hold no secrets, and a forgotten password cannot be
# recovered.
encrypt_by_default = false
# Protect API Keys With a Password: whether a backup that includes the AI service keys starts
# with the keys protected by a password when the whole backup is not. On; turning it off in the
# dialog needs a confirm.
encrypt_secrets = true
