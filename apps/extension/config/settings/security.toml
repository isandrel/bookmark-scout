# Defaults for Options > Security.

[privacy_scanner]
# Always scans all bookmarks.
enabled = true
scan_titles = false
scan_query_params = true
scan_fragments = true
# Query parameter names reported as sensitive. Settings sync, so the list is capped to keep
# every synced item, and all of them together, within the browser's sync quota.
sensitive_params = { max_items = 20, max_length = 32, default = [
  "token",
  "access_token",
  "refresh_token",
  "auth",
  "authorization",
  "api_key",
  "apikey",
  "key",
  "secret",
  "password",
  "pwd",
  "code",
  "session",
] }
email_detection = true
uuid_detection = true
