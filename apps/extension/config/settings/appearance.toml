# Defaults for Options > Appearance. Read by src/lib/settings-schema.ts, which also holds the
# option lists for language, theme, and favicon size.

# Language preference: "auto" (follow browser) or a public/_locales folder name such as "ja" or "zh_CN"
language = "auto"

# Theme preference: "system", "light", or "dark"
theme = "system"

# Whether to display favicon icons next to bookmarks
show_favicons = true

# Chrome and Edge: also show icons from the browser's own icon cache, for sites without an icon
# saved by Refresh Site Icons. Needs the optional `favicon` permission, asked for when turned on.
browser_icon_cache = false

# Size of favicon icons in pixels: 16, 24, or 32
favicon_size = 16
