# Defaults for Options > Appearance, one table per section. Read by src/lib/settings-schema.ts,
# which also holds the option lists for language, theme, and favicon size.

[theme_icons]
# Language preference: "auto" (follow browser) or a public/_locales folder name such as "ja" or "zh_CN"
language = "auto"
# Theme preference: "system", "light", or "dark"
theme = "system"
# Whether to display favicon icons next to bookmarks
show_favicons = true
# Chrome and Edge: also show icons from the browser's own icon cache, for sites without an icon
# saved by Refresh Site Icons. Needs the optional `favicon` permission, asked for when turned on.
browser_icon_cache = false
# Size of favicon icons in pixels, one of the options; each option's label is a message key
favicon_size = { default = 16, options = [
  { value = 16, label = "settings_faviconSmall" },
  { value = 24, label = "settings_faviconMedium" },
  { value = 32, label = "settings_faviconLarge" },
] }

[dates]
# How dates and times show everywhere (the manager's date columns, History, details): a format
# id from config/ui/date-formats.toml. "auto" follows the extension's language.
date_format = "auto"
time_format = "auto"

[addresses]
# Whether addresses show the "/" they end with ("https://example.com/" rather than
# "https://example.com"). Links always open the exact address.
show_trailing_slash = false

[popup]
# Popup window size in pixels. Chrome and Edge cap extension popups at 800x600, so larger stored
# values snap to the limit (clamp) instead of resetting. src/entrypoints/popup/index.html opens at
# the defaults and minimums; a unit test keeps it in step with these values.
width = { default = 400, min = 300, max = 800, step = 50, clamp = true }
height = { default = 500, min = 300, max = 600, step = 50, clamp = true }
# Maximum characters before truncating bookmark titles
truncate_length = { default = 50, min = 20, max = 200, step = 10 }
# Resting the pointer on a bookmark in the popup or side panel, or moving to it with the arrow keys,
# shows its details (address, folder, tags, summary, cover, date added) in a card; the delays and
# sizes are in config/ui/hover-card.toml. Off, the row keeps the browser's plain tooltip
show_hover_details = true
# The lists below and the tree density are the popup's layout, kept on this device
# (DEVICE_SETTING_KEYS in src/lib/storage/registry.ts), since it suits one screen.
# What the hover card shows, in order: ids from HOVER_CARD_FIELDS in src/lib/hover-card.ts, then
# the hidden ones marked with a leading "!" (src/lib/shown-ids.ts). A detail not named at all was
# added since and shows
hover_card_fields = { default = [
  "title",
  "address",
  "cover",
  "tags",
  "summary",
  "folder",
  "dateAdded",
], max_items = 12, max_length = 20 }
# Row height of the popup and side panel tree: "comfortable" or "compact"; each one's metrics are
# in config/ui/popup-tree-view.toml
tree_density = "comfortable"
# The popup and side panel's parts from top to bottom, below the search row: ids from
# POPUP_SECTIONS in src/lib/popup-layout.ts, then the hidden ones marked with a leading "!"
# (src/lib/shown-ids.ts). A part not named at all was added since and shows; the bookmark tree
# always shows
sections = { default = [
  "currentPage",
  "activeJobs",
  "quickSaveResult",
  "recentFolders",
  "aiSuggestions",
  "folderMatches",
  "tree",
  "notices",
  "hintBar",
], max_items = 16, max_length = 20 }
# The buttons beside the search box, in order: ids from POPUP_TOOLBAR_BUTTONS in
# src/lib/popup-layout.ts, then the hidden ones marked with a leading "!" (src/lib/shown-ids.ts). A
# button not named at all was added since and shows; the AI buttons still show
# only once AI is set up, and Expand all only while a search is typed
toolbar_buttons = { default = [
  "expandAll",
  "openManager",
  "theme",
  "!openSettings",
  "aiRecommend",
  "askAI",
  "serviceSwitcher",
], max_items = 12, max_length = 20 }

[notifications]
# Duration in milliseconds before toast notifications auto-dismiss
toast_duration_ms = { default = 4000, min = 2000, max = 10000, step = 500 }
# Milliseconds the pointer rests on a control before its tooltip opens; every page shares it
tooltip_delay_ms = { default = 200, min = 0, max = 2000, step = 100 }
# Milliseconds the pointer rests on a bookmark, or keyboard focus stays on it, before its hover card
# opens (Show Details on Hover, and the manager's cut-short summaries)
hover_card_delay_ms = { default = 600, min = 0, max = 2000, step = 100 }
# Where messages (toasts) show on every Bookmark Scout page: "bottom-right", "bottom-left",
# "bottom-center", "top-right", "top-left", or "top-center" (TOAST_POSITION_STYLES in
# src/components/ui/toast.tsx)
toast_position = "bottom-right"
