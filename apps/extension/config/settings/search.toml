# Defaults for Options > Search. Numeric settings list their default with the bounds and step
# that Options and validation share.

# Delay in milliseconds before search starts after typing
debounce_ms = { default = 300, min = 50, max = 1000, step = 50 }

# Maximum number of search results to display: 10, 20, 50, or 100
max_results = 20

# Automatically expand folders when searching
expand_folders_on_search = true

# Remember and display recent searches
search_history = true

# List the folders that match the search above the results, to save the current page there
folder_matches_enabled = true

# How many matching folders to list
folder_matches_max = { default = 5, min = 1, max = 10, step = 1 }

# Let a longer search word match a folder name with one typo ("rect" finds React)
folder_matches_typos = true
