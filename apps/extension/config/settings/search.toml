# Defaults for Options > Saving & Search. Each table is one section of that tab, in the same
# order; numeric settings list their default with the bounds and step that Options and
# validation share. Read by src/lib/settings-schema.ts.

[folder_matches]
# List the folders that match the search above the results, to save the current page there
enabled = true
# How many matching folders to list
max = { default = 5, min = 1, max = 10, step = 1 }
# Let a longer search word match a folder name with one typo ("rect" finds React)
typos = true

[search]
# Maximum number of search results to display: 10, 20, 50, or 100
max_results = 20
# Automatically expand folders when searching
expand_folders = true
# Remember and display recent searches
history = true
# Delay in milliseconds before search starts after typing
debounce_ms = { default = 300, min = 50, max = 1000, step = 50 }
# Recent searches kept; older ones are dropped
history_max = { default = 10, min = 1, max = 50, step = 1 }

[saving]
# Enable recent folders quick select panel
recent_folders_enabled = true
# Maximum number of recent folders to show for quick select
recent_folders_max = { default = 5, min = 1, max = 10, step = 1 }
# Default name for newly created folders
default_new_folder_name = { default = "New Folder", min_length = 1, max_length = 100 }

[context_menu]
# Enable right-click context menu for quick bookmark saving. Off by default: Chrome and Edge
# grant the optional `contextMenus` permission only when the user turns it on.
enabled = false
# Source for bookmark title when saving via context menu
# Options: "link_text" (text of the link), "page_title" (title of the page), "link_url" (URL of the link)
bookmark_naming = "link_text"

[quick_save]
# Where the quick save shortcut (Alt+Shift+S unless the user rebinds it) saves the current page:
# "best_match" (the folder whose name and bookmarks best match the page, ranked on this device),
# "last_used" (the most recent of the recent folders), or "fixed" (fixed_folder below). A best
# match below the minimum score, or a fixed folder that no longer exists, falls back to the last
# used folder, then the bookmarks bar.
folder_strategy = "best_match"
# Bookmark id of the folder for "fixed"; empty until the user picks one in Options.
fixed_folder = ""
# How many other folders the notification offers to move the page to: without AI, the next best
# matching folders; with AI, the other suggestions, up to Maximum Recommendations
alternatives = { default = 3, min = 0, max = 8, step = 1 }
# Milliseconds before the quick save notification closes on its own; hovering or focusing it
# pauses the countdown, and "Saving…" stays until the save finishes
notification_ms = { default = 8000, min = 2000, max = 60000, step = 1000 }
