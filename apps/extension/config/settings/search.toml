# Defaults for Options > Saving & Search. Each table is one section of that tab, in the same
# order; numeric settings list their default with the bounds and step that Options and
# validation share. Read by src/lib/settings-schema.ts.

[folder_matches]
# List the folders that match the search above the results, to save the current page there
enabled = true
# How many matching folders to list
max = { default = 5, min = 1, max = 10, step = 1 }
# Let a longer search word match a folder name with one typo ("rect" finds React)
typos = true

[search]
# Maximum number of search results to display, one of the options; the label message takes the
# number
max_results = { default = 20, options = [
  { value = 10, label = "settings_results" },
  { value = 20, label = "settings_results" },
  { value = 50, label = "settings_results" },
  { value = 100, label = "settings_results" },
] }
# Automatically expand folders when searching
expand_folders = true
# Remember and display recent searches
history = true
# Delay in milliseconds before search starts after typing
debounce_ms = { default = 300, min = 50, max = 1000, step = 50 }
# Recent searches kept; older ones are dropped
history_max = { default = 10, min = 1, max = 50, step = 1 }

[saving]
# Enable recent folders quick select panel
recent_folders_enabled = true
# Maximum number of recent folders to show for quick select
recent_folders_max = { default = 5, min = 1, max = 10, step = 1 }
# Default name for newly created folders
default_new_folder_name = { default = "New Folder", min_length = 1, max_length = 100 }

[context_menu]
# Enable right-click context menu for quick bookmark saving. Off by default: Chrome and Edge
# grant the optional `contextMenus` permission only when the user turns it on.
enabled = false
# Source for bookmark title when saving via context menu
# Options: "link_text" (text of the link), "page_title" (title of the page), "link_url" (URL of the link)
bookmark_naming = "link_text"
# Where the menu shows: "link" (on links), "page" (on the page itself), and "selection" (on
# selected text), the browser contexts in config/ui/context-menu.toml. At least one; links only by
# default, as before the setting existed
contexts = { default = ["link"], max_items = 3, max_length = 9 }
# The entries the menu shows, in order, as ids from `[[entries]]` in config/ui/context-menu.toml,
# then the hidden ones marked with a leading "!" (src/lib/shown-ids.ts). An entry not named at all
# was added since and shows in its place in that file, so empty means every entry in its order
entries = { default = [], max_items = 2, max_length = 14 }
# How many recent folders the menu lists. Separate from Recent Folders Max, which is the popup's;
# at most the number of recent folders kept (src/lib/recent-folders-storage.ts)
recent_max = { default = 5, min = 1, max = 10, step = 1, integer = true }

[address_bar]
# Address Bar Search: typing the keyword (config/ui/omnibox.toml) and a space in the address bar
# lists matching bookmarks there. Off until the user turns it on; the keyword answers with a
# pointer to this setting meanwhile
enabled = false
# How many bookmarks the address bar lists for a search
max_results = { default = 6, min = 1, max = 9, step = 1, integer = true }

[quick_save]
# Where the quick save shortcut (Alt+Shift+S unless the user rebinds it) saves the current page:
# "best_match" (the folder whose name and bookmarks best match the page, ranked on this device),
# "last_used" (the most recent of the recent folders), or "fixed" (fixed_folder below). A best
# match below the minimum score, or a fixed folder that no longer exists, falls back to the last
# used folder, then the bookmarks bar.
folder_strategy = "best_match"
# Bookmark id of the folder for "fixed"; empty until the user picks one in Options.
fixed_folder = ""
# How many other folders the notification offers to move the page to: without AI, the next best
# matching folders; with AI, the other suggestions, up to Maximum Recommendations
alternatives = { default = 3, min = 0, max = 8, step = 1 }
# Milliseconds before the quick save notification closes on its own; hovering or focusing it
# pauses the countdown, and "Saving…" stays until the save finishes
notification_ms = { default = 8000, min = 2000, max = 60000, step = 1000 }
# Save a Cover With Quick Save: after a quick save, keep a cover for the bookmark, the page's own
# preview image or a picture of the tab (src/services/quick-save-cover.ts). Off until the user turns
# it on (maintainer decision, 2026-10-22), and it acts only while Fetch Covers is also on
# (metadata_content.covers.enabled, off by default); never in private windows, and never on sites
# on Never Capture These Sites or Never Read These Sites.
cover = false
# Quick Save Cover Source: "same" follows Cover Source (metadata_content.covers.source_preference);
# otherwise one of the choices in config/bookmarks/cover-preferences.toml, for quick save only.
cover_source = "same"
# When the Bookmark Already Has a Cover: "keep" leaves a cover it has, "replace" puts the new one
# in its place. Neither ever replaces a cover chosen with Use this view as the cover.
cover_existing = "keep"

[settings_search]
# The search field at the top of the Options page (src/lib/settings-search.ts; how it compares
# words is config/ui/settings-search.toml).
# Search In: the texts of each setting it looks in, ids from SETTING_SEARCH_SOURCE_IDS in
# src/lib/settings-schema.ts: "label" (its name), "description", "keywords" (other words some
# settings are known by, the settings_<stem>Keywords messages), and "id" (its setting ID, such as
# popupWidth, the same in every language). At least one; all of them by default
sources = { default = ["label", "description", "keywords", "id"], max_items = 4, max_length = 11 }
# Word Matching: "allWords" (each word anywhere, in any order, as the bookmark search does) or
# "phrase" (the whole search as typed, as Chrome's own settings search does)
match = "allWords"
# Mark the searched words in the results, and the tabs that hold matches, in the marker color
highlight = true
# Under a result, say where it matched when its row does not show that text (its description,
# keywords, or setting ID)
notes = true
# Show beside each tab how many of its settings match
tab_counts = true
