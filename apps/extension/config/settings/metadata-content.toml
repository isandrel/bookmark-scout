# Defaults for Options > Metadata & Content, one table per tool section. `default_scope` is
# "folder" or "all".

[metadata_fetcher]
enabled = true
default_scope = "all"
overwrite_titles = false
fetch_descriptions = true
request_timeout_ms = { default = 8000, min = 1000, max = 60000, step = 500 }
concurrency = { default = 4, min = 1, max = 20, step = 1 }

[page_text]
# Index Page Text keeps the readable text of the pages a run covers on this device, so search finds
# words inside them (config/bookmarks/page-text.toml). Off until the user turns it on: it downloads
# each page.
enabled = false
default_scope = "folder"
# Never request an address that holds a user name and password, or a query parameter named in the
# Privacy Scanner's Sensitive Parameters (such as a token), which the site would receive; such a
# bookmark is listed as skipped with the reason. Turned off, those addresses are read like any other.
skip_secret_urls = true
# Sites whose pages are never read, each with its subdomains (example.com covers
# news.example.com), entered in Options. Adding a site deletes the text indexed from it. Synced
# like the other settings, so each entry is a short host name.
excluded_sites = { default = [], max_items = 30, max_length = 100 }

[site_icons]
# Refresh Site Icons downloads each website's own icon into local storage. It reuses the
# Metadata Fetcher's request timeout and concurrency.
enabled = true
default_scope = "all"
# Icon size in pixels to prefer when a page lists several
preferred_size = { default = 32, min = 16, max = 256, step = 8, integer = true }
# Largest icon file that is downloaded, in KB
max_icon_kb = { default = 64, min = 1, max = 512, step = 1, integer = true }
# Total size of all cached icons in local storage, in KB; the oldest are removed first
max_cache_kb = { default = 4096, min = 256, max = 8192, step = 256, integer = true }

[covers]
# Fetch Covers keeps a small copy of the preview image each page names for itself on this device,
# for the manager's cards (config/bookmarks/covers.toml). Off until the user turns it on: it
# downloads each page's head and its image.
enabled = false
default_scope = "folder"
# Width of the stored copy in pixels; taller or wider images are shrunk to it. 960 keeps a card
# (about 340 CSS px) sharp on a 2x screen and the preview dialog close to it.
width_px = { default = 960, min = 160, max = 1920, step = 40, integer = true }
# Largest image file that is downloaded, in KB
max_image_kb = { default = 2048, min = 128, max = 8192, step = 128, integer = true }
# Cover Image Quality: the WebP quality every stored cover is written at (Fetch Covers, Use this
# view as the cover, Capture Covers While Browsing, quick save), shown as a percentage. Lower makes
# smaller files; it applies to covers saved from then on.
quality = { default = 0.8, min = 0.5, max = 1, step = 0.05 }
# Total size of all stored covers on this device, in MB; the oldest are removed first
max_cache_mb = { default = 200, min = 10, max = 1000, step = 10, integer = true }
# Cover Source: which kind of cover a bookmark keeps when both its page's own image and a picture of
# the tab can be had; one of the choices in config/bookmarks/cover-preferences.toml
source_preference = "page_first"
# Capture Covers While Browsing: when a bookmarked page without a cover (or with an old one)
# finishes loading in the active tab of the focused window, take a picture of the tab as its cover
# (config/bookmarks/browse-covers.toml). Off until the user turns it on; it needs access to all
# pages (the optional `<all_urls>`), asked for when it is turned on. Pictures stay on this device.
browse_capture = false
# Capture Covers While Browsing's limits, shown under it while it is on. Also capture in private
# windows: off by default; when on, only where the browser lets the extension run in private
# windows (Allow in Incognito, Run in Private Windows), else they are still skipped
browse_capture_private = false
# How long a page must stay in front after it finished loading before it is pictured, in ms (shown
# in seconds), so a page still drawing late content, or one the user leaves at once, is not taken
browse_settle_ms = { default = 1500, min = 0, max = 10000, step = 500, integer = true }
# Least time between two pictures, in ms (shown in seconds). Chrome refuses more than two
# captureVisibleTab calls a second (MAX_CAPTURE_VISIBLE_TAB_CALLS_PER_SECOND = 2), so the floor is
# 500 ms plus a margin; tests/unit/browse-covers.test.ts fails if it drops to `browser_min_interval_ms`
# in config/bookmarks/browse-covers.toml. Firefox has no such limit; the same floor applies there.
browse_min_interval_ms = { default = 1000, min = 600, max = 60000, step = 100, integer = true }
# A picture taken while browsing older than this many days is taken again on the next visit; 0 never
# retakes one. A cover chosen with Use this view as the cover is never retaken
browse_max_age_days = { default = 30, min = 0, max = 365, step = 1, integer = true }
# Sites never pictured while browsing: each entry is a host and its subdomains (`example.com` also
# covers `mail.example.com`). Smaller than Never Read These Sites, whose sites are skipped too;
# synced, so capped to keep every synced item within the browser's sync quota
never_capture_sites = { default = [], max_items = 20, max_length = 80 }
