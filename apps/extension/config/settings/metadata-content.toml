# Defaults for Options > Metadata & Content, one table per tool section. `default_scope` is
# "folder" or "all".

[metadata_fetcher]
enabled = true
default_scope = "all"
overwrite_titles = false
fetch_descriptions = true
request_timeout_ms = { default = 8000, min = 1000, max = 60000, step = 500 }
concurrency = { default = 4, min = 1, max = 20, step = 1 }

[page_text]
# Index Page Text keeps the readable text of the pages a run covers on this device, so search finds
# words inside them (config/bookmarks/page-text.toml). Off until the user turns it on: it downloads
# each page.
enabled = false
default_scope = "folder"
# Never request an address that holds a user name and password, or a query parameter named in the
# Privacy Scanner's Sensitive Parameters (such as a token), which the site would receive; such a
# bookmark is listed as skipped with the reason. Turned off, those addresses are read like any other.
skip_secret_urls = true
# Sites whose pages are never read, each with its subdomains (example.com covers
# news.example.com), entered in Options. Adding a site deletes the text indexed from it. Synced
# like the other settings, so each entry is a short host name.
excluded_sites = { default = [], max_items = 30, max_length = 100 }

[site_icons]
# Refresh Site Icons downloads each website's own icon into local storage. It reuses the
# Metadata Fetcher's request timeout and concurrency.
enabled = true
default_scope = "all"
# Icon size in pixels to prefer when a page lists several
preferred_size = { default = 32, min = 16, max = 256, step = 8, integer = true }
# Largest icon file that is downloaded, in KB
max_icon_kb = { default = 64, min = 1, max = 512, step = 1, integer = true }
# Total size of all cached icons in local storage, in KB; the oldest are removed first
max_cache_kb = { default = 4096, min = 256, max = 8192, step = 256, integer = true }

[covers]
# Fetch Covers keeps a small copy of the preview image each page names for itself on this device,
# for the manager's cards (config/bookmarks/covers.toml). Off until the user turns it on: it
# downloads each page's head and its image.
enabled = false
default_scope = "folder"
# Width of the stored copy in pixels; taller or wider images are shrunk to it
width_px = { default = 480, min = 160, max = 960, step = 40, integer = true }
# Largest image file that is downloaded, in KB
max_image_kb = { default = 2048, min = 128, max = 8192, step = 128, integer = true }
# Total size of all stored covers on this device, in MB; the oldest are removed first
max_cache_mb = { default = 50, min = 10, max = 500, step = 10, integer = true }
