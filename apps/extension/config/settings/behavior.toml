# Defaults for Options > Behavior, one table per section.

[tree]
# Default sort order: "browser" (the order the browser keeps, as on the bookmarks bar), "date"
# (newest first), "alphabetical", or "folders" (folders first, then the browser's order)
sort_order = "browser"
# Organize bookmarks by folder structure
group_by_folders = true
# Drag bookmarks and folders in the popup and side panel tree, and drop links from web pages on a
# side panel folder; off keeps the tree still for people who drag by accident while scrolling
drag_and_drop = true

[links]
# Where a clicked link opens: "new_tab" (switch to it), "background_tab" (stay here), or
# "current_tab" (replace the page). Middle-click and Ctrl/Cmd-click keep the browser's behavior.
open_target = "new_tab"
# Opening more bookmarks than this at once (Enter, Open all) asks first, as Chrome's manager does
# at 15. A folder counts the bookmarks directly inside it.
confirm_open_above = { default = 15, min = 2, max = 200, step = 1 }

[manager_menus]
# The bookmark manager's item menu (right-click and ⋯): the actions shown, in order, as action ids
# from config/ui/actions.toml. Empty means that file's menu. Edited in Options > Behavior.
actions = { default = [], max_items = 16, max_length = 20 }

[manager_view]
# How the manager shows a folder or search: "list" (the table) or "cards" (a grid of cards with the
# same rows, selection, and menus)
mode = "list"

[tools_sidebar]
# How the manager's Tools sidebar lists its tools: "tabs" (one tab per section, plus All, opening
# on default_tab in config/ui/tools-sidebar.toml) or "list" (every section, one after another)
layout = "tabs"

[deleting]
# Show confirmation dialog before deleting items
confirm = true

[history]
# List bookmark changes made outside Bookmark Scout (the browser's own bookmark manager, other
# extensions, browser sync) in the manager's History, as from an unknown source. Off pauses it:
# nothing from elsewhere is recorded, and turning it on again records what changed meanwhile as
# one difference. Kept on this device only, like the History itself.
record_outside_changes = true
