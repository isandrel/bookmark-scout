# Defaults for Options > AI, one table per section. AI stays off until the user turns it on.

[enable]
# Enable AI-powered folder recommendations
enabled = false

[suggestions]
# Auto-trigger AI recommendations when popup opens
auto_trigger_on_open = false
# Folder suggestions shown in the popup
max_recommendations = { default = 5, min = 1, max = 10, step = 1 }

[page_reading]
# Send the readable text of each page, not only its title and URL, to folder recommendations,
# Auto-Tagging, and Content Summarizer. Needs website access, which is asked for when turned on.
read_page_content = false

[activity]
# Record the last AI requests on this device (Options > AI > AI activity). A device setting: it
# never syncs, and neither does the log.
recording = false

[ask_ai]
# Ask AI adds the provider's web search, where the provider has one. Chosen in the Ask AI panel,
# for this device only.
web_search = false
# Actions Ask AI may not use, as action ids; empty lets it use all of them. Edited in Options > AI.
disabled_actions = { default = [], max_items = 16, max_length = 20 }

[agent_bridge]
# Let AI agents on this computer (Claude Code, Codex, Cursor) look up bookmarks through the
# bookmark-scout-mcp bridge the user installs. Needs native messaging, asked for when turned on.
# Device settings: the bridge is installed on one computer.
enabled = false
# Hide private values (sensitive query parameters, tokens, email addresses) in the titles and URLs
# agents receive, by the Privacy Scanner's rules.
redact_urls = true
# Actions local agents may not use, as action ids; empty lets them use all they are offered.
disabled_actions = { default = [], max_items = 16, max_length = 20 }
