# Defaults for Options > Maintenance, one table per tool section. `default_scope` is "folder" or
# "all"; a tool that always scans all bookmarks has none.

[duplicates]
# Always scans all bookmarks.
enabled               = true
match_strategy        = "normalized_url"
normalize_www         = true
ignore_protocol       = true
ignore_trailing_slash = true
keep_rule             = "oldest"
max_groups            = { default = 500, min = 1, max = 5000, step = 10 }

[bookmark_rules]
# Smart Rules: the rules themselves are kept on this device (src/lib/bookmark-rules-storage.ts).
enabled = true
default_scope = "all"
# Tag New Bookmarks: enabled rules add their tags to bookmarks as they are added (config/rules/
# rules.toml [automatic]), from the sources new_from allows. Off until the user turns it on; it
# never moves anything.
auto_tag = false
# Move New Bookmarks: rules the user marked "Move new bookmarks automatically" move new bookmarks to
# their folder. A separate opt-in from tagging, off until the user turns it on. It never moves a
# bookmark Bookmark Scout saved (the user chose its folder), so it acts only with new_from = "any".
auto_move = false
# Which new bookmarks both act on: "scout", only those saved through Bookmark Scout (the
# extension's own undo history names them), or "any", also those from the browser's star, sync,
# and other extensions, which the browser does not tell apart. Changes from elsewhere are only
# observed until the user opts in (maintainer decision R4).
new_from = "scout"

[url_cleaner]
enabled = true
default_scope = "all"
remove_hash = false
sort_query_params = true
dedupe_query_params = true
# Query parameter names kept and removed. Settings sync, so each list is capped to keep every
# synced setting within the browser's 8 KB item quota.
preserve_params = { max_items = 20, max_length = 32, default = [ "id", "page", "q", "p", "lang" ] }
# A name ending in * matches every name that starts with it (src/lib/param-name-patterns.ts).
remove_params = { max_items = 20, max_length = 32, default = [
  "utm_*",
  "gclid",
  "fbclid",
  "mc_cid",
  "mc_eid",
  "ref",
  "ref_src",
  "si",
] }

[dead_links]
enabled            = true
default_scope      = "all"
request_timeout_ms = { default = 8000, min = 1000, max = 60000, step = 500 }
concurrency        = { default = 4, min = 1, max = 20, step = 1 }
retry_count        = { default = 1, min = 0, max = 10, step = 1 }
follow_redirects   = true
success_statuses   = { max_items = 20, default = [ 200, 201, 202, 204, 301, 302, 307, 308 ] }
# What the repair review starts each link on, by category; "keep" changes nothing until the
# user picks. Dead and manual-check links: "keep", "delete", or "archive"; redirects: "keep" or
# "redirect" (the target the scan saw).
on_dead     = "keep"
on_check    = "keep"
on_redirect = "keep"

[background_tasks]
# Reviewed changes to more bookmarks than this are applied as a background task, in parts, so
# closing the page does not stop them halfway; fewer are applied at once, with Undo in the
# notification. Each part is one change in the History.
apply_in_background_above = { default = 200, min = 1, max = 50000, step = 1 }
