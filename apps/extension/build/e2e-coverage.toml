# End-to-end coverage: which source the Chromium suite runs in the extension's pages, measured
# with V8 (monocart-coverage-reports) on a build with inline source maps. Read by
# build/e2e-coverage.ts; run with `bun run test:e2e:coverage`.
#
# Measured: the pages a test opens (popup, side panel, manager, Options, and the others) and the
# background service worker, reached over a DevTools port the browser opens in this mode, from when
# its test starts (the worker's own startup ran before that). Not measured: a page a test closes
# itself before its context closes, and a worker a test stops. Unit coverage is build/unit-coverage.toml.

# The coverage build goes here, beside dist/, so the build the maintainer's browser loads from
# dist/ is never replaced by it.
out_dir = "dist-coverage"
reports_directory = "coverage/e2e"
# v8 for the browsable report, json-summary for the table, lcov for other tools.
reporters = ["v8", "json-summary", "lcov", "console-summary"]
# Source files counted, after the source maps are applied.
include = ["src/**"]
# Folders the summary table lists (scripts/coverage-summary.ts e2e).
summary_folders = ["src/components/**", "src/hooks/**", "src/lib/**", "src/services/**", "src/stores/**"]
