# Upper bounds, in bytes, for the release packages: scripts/check-distribution-size.ts measures
# the actual WXT ZIP (`size:check <browser>` in the Build Extension CI jobs). Category limits
# count uncompressed bytes; ZIP payload and overhead are reported separately. Independent of the
# startup budgets in tests/e2e/startup-budgets.toml.
#
# Policy: every limit sits about 10% above the largest measurement of the three browsers, so
# ordinary features fit without touching this file. These are guard rails against a large
# accidental jump (a dependency or asset that should not ship), not a ratchet. When a build does
# pass a limit, re-measure every value on the branch with main merged in and reset that limit to
# about 10% above, with the reason in the pull request; never raise it by a few bytes, which made
# the next PR in the queue fail as soon as main was merged into it (October 2026). Lower limits
# the same way after a change that removes a lot. Earlier limits and their reasons are in this
# file's git history.
#
# Measured 2026-11-01 with Ask AI on Pi Durable (Bun 1.4.4, WXT 0.21.5), Chrome: ZIP 2,390,945 B;
# uncompressed 8,091,336 B; javascript 4,672,709, css 92,550, fonts 138,180, locales 2,846,779,
# images 309,981, other 31,137 B (Edge and Firefox were within a few hundred bytes before; Pi
# Durable is the same code in all three). The ZIP, uncompressed, and javascript limits were reset
# for it; the others are unchanged.

[targets.chrome]
zip_bytes = 2_630_000
raw_bytes = 8_900_000

[targets.edge]
zip_bytes = 2_630_000
raw_bytes = 8_900_000

[targets.firefox]
zip_bytes = 2_630_000
raw_bytes = 8_900_000

[categories]
javascript = 5_140_000
css = 102_000
fonts = 152_000
locales = 3_130_000
images = 341_000
other = 34_500
