# Actual WXT ZIP limits in bytes; these are independent from startup-budgets.toml.
# Measured: 2026-10-15, Bun 1.4.2 / WXT 0.21.4, local optimized production builds of 12d42c3b with
# the size-headroom changes (unused message keys removed, pino and cmdk replaced).
# Chrome / Edge / Firefox ZIP: 1,592,411 / 1,592,411 / 1,592,564 B.
# Uncompressed: 5,077,004 / 5,076,966 / 5,077,231 B.
# Lowered on 2026-10-15 from 1,621,000 (ZIP) and 5,173,000 (uncompressed), which local builds had
# outgrown, to about 15 KB (ZIP) and 40 KB (uncompressed) above the largest measurement. Lower
# them alongside improvements; raising a limit requires measured artifacts and a dated reason in
# the PR. CI measures a few hundred bytes below local builds.
# Raised on 2026-10-18 (uncompressed 5,118,000 to 5,135,000, locales 1,170,000 to 1,183,000) for
# the AI output language setting, whose copy in 9 languages adds 4.2 KB to the locales, on top of
# main's growth since the last measurement: local builds of feat/ai-output-language merged with
# 3dc4b31a measured 5,124,823 / 5,124,785 / 5,125,050 B uncompressed (Chrome / Edge / Firefox) and
# 1,173,409 B of locales; the new limits are about 10 KB above that.
# Raised again on 2026-10-18 (ZIP 1,608,000 to 1,618,000, uncompressed 5,135,000 to 5,159,000,
# locales 1,183,000 to 1,195,000) for the prompt placeholders: About me, Send Existing Tags, and the
# prompt editor's placeholder list, whose copy in 9 languages adds 12 KB to the locales. Local
# builds of feat/ai-prompt-placeholders on e5f11db0 measured ZIP 1,612,939 / 1,612,953 / 1,613,031,
# uncompressed 5,148,937 / 5,148,899 / 5,149,164 B (Chrome / Edge / Firefox), and 1,185,334 B of
# locales; the new limits are about 5 KB (ZIP) and 10 KB above that.
# Raised on 2026-10-19 (ZIP 1,618,000 to 1,632,000, uncompressed 5,159,000 to 5,202,000, javascript
# 3,446,000 to 3,464,000) for the ai-sdk patch updates in Dependabot #709 (ai 7.0.137 to 7.0.142 and
# eleven @ai-sdk packages), which grow the provider chunks by 1 to 3 KB each with no local code
# change. Local builds of that branch measured ZIP 1,626,013 / 1,625,965 / 1,626,131, uncompressed
# 5,191,926 / 5,191,888 / 5,192,153 B (Chrome / Edge / Firefox), and 3,453,673 B of JavaScript,
# against main (87cbf244) at ZIP 1,613,680 and 5,151,110 B uncompressed (Firefox); the new limits are
# about 6 KB (ZIP) and 10 KB above the branch.
# Uncompressed raised again on 2026-10-20 (5,202,000 to 5,212,000) after #710 and #712 (next, docs,
# and minor dependency updates) merged into #709: CI measured the Firefox build at 5,202,161 B, 161 B
# over; the new limit is about 10 KB above that.
# Raised on 2026-10-20 (ZIP 1,632,000 to 1,644,000, uncompressed 5,212,000 to 5,236,000, javascript
# 3,464,000 to 3,494,000, css 81,000 to 84,000) for the shared reorderable list (SortableList on
# Pragmatic drag and drop with its closest-edge hitbox, auto-scroll, live region, and Atlassian's
# React drop indicator with its compiled CSS) and its copy in 9 languages. Firefox measured ZIP
# 1,629,718 and 5,202,241 B uncompressed on main, and with the list 5,227,193 B uncompressed,
# 3,484,153 B of JavaScript, and 81,522 B of CSS; the new limits are about 10 KB (CSS 2.5 KB)
# above that, so the later drag-and-drop phases measure their own growth.
# Raised on 2026-10-20 (ZIP 1,644,000 to 1,652,000, uncompressed 5,236,000 to 5,248,000) for the
# later drag-and-drop phases: reorderable columns and saved searches, file drops on Import and
# Settings, link drops on side panel folders, and the setting that turns tree drag off, with their
# copy in 9 languages. Firefox measured ZIP 1,643,008 and 5,238,392 B uncompressed; the new limits
# are about 9 KB above that.
# JavaScript raised on 2026-10-20 (3,494,000 to 3,504,000) for dragging the manager table's column
# headers and announcing manager drops: Firefox measured 3,494,169 B of JavaScript.
# Raised on 2026-10-20 (ZIP 1,652,000 to 1,662,000, uncompressed 5,248,000 to 5,280,000, javascript
# 3,504,000 to 3,530,000) for the Bookmark Audit History store (`idb`, the records written around
# every bookmark change, and undo and redo linked to them) and its error copy in 9 languages.
# Firefox measured ZIP 1,652,985, 5,268,941 B uncompressed, and 3,519,656 B of JavaScript.
# Raised on 2026-10-20 (ZIP 1,662,000 to 1,680,000, uncompressed 5,280,000 to 5,352,000, javascript
# 3,530,000 to 3,550,000) for the manager's Bookmark history (the dialog, its view rules, and about
# 80 messages in 9 languages). Firefox measured ZIP 1,670,353, 5,340,282 B uncompressed, and
# 3,539,986 B of JavaScript.
# Locales raised the same day (1,195,000 to 1,250,000) for those messages: 1,243,201 B measured.
# Raised again the same day (ZIP 1,680,000 to 1,690,000, uncompressed 5,352,000 to 5,380,000, javascript
# 3,550,000 to 3,565,000, locales 1,250,000 to 1,262,000) for watching bookmark changes made
# outside Bookmark Scout (the background observer, write notes, and its setting and messages).
# Firefox measured ZIP 1,682,501, 5,368,778 B uncompressed, 3,557,114 B of JavaScript, and
# 1,253,871 B of locales.
# Uncompressed raised on 2026-10-20 (5,380,000 to 5,392,000) for restoring deleted items from the
# History (recovery checkpoints, the Restore button, and its messages in 9 languages). Firefox
# measured 5,380,660 B uncompressed, ZIP 1,685,331.
# ZIP payload and overhead are reported separately; category limits measure uncompressed bytes.

[targets.chrome]
zip_bytes = 1_690_000
raw_bytes = 5_392_000

[targets.edge]
zip_bytes = 1_690_000
raw_bytes = 5_392_000

[targets.firefox]
zip_bytes = 1_690_000
raw_bytes = 5_392_000

[categories]
# javascript and locales lowered on 2026-10-15 to about 2% above the measurement above:
# javascript 3,378,374 (Firefox) and locales 1,146,638 B. The others are unchanged, about 3%
# above their measurements (css 78,650, fonts 138,180, images 309,981, other 25,408 B).
javascript = 3_565_000
css = 84_000
fonts = 143_000
locales = 1_262_000
images = 320_000
other = 27_000
