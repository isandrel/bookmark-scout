# Actual WXT ZIP limits in bytes; these are independent from startup-budgets.toml.
# Measured: 2026-10-14, Bun 1.4.2 / WXT 0.21.4, optimized production builds based on 58097ad.
# Chrome / Edge / Firefox ZIP: 1,573,050 / 1,573,113 / 1,573,224 B.
# Uncompressed: 5,008,968 / 5,008,938 / 5,009,191 B.
# Ceilings allow about 3% above measurements, rounded up to 1,000 B. Lower them alongside
# improvements; raising a limit requires measured artifacts and a dated reason in the PR.
# ZIP payload and overhead are reported separately; category limits measure uncompressed bytes.
# raw_bytes raised on 2026-10-15 from 5,160,000 for the Options/AI QA fixes (#684: on-device and
# action activity badges, Settings > AI copy, built-in AI notes in nine languages) on top of the
# popup first-run fixes (#686): measured Chrome / Edge / Firefox 5,164,351 / 5,164,313 / 5,164,578 B
# on 78ba7960 merged with #684, rounded up with about 1,400 B to spare. ZIP limits unchanged
# (measured 1,620,202 / 1,620,111 / 1,620,368 B).
# raw_bytes raised again on 2026-10-15 for the manager QA fixes (#685: undo history for Tools
# batches, folder paths in cross-folder search, clearer tool results; ten new strings in nine
# languages, after shortening their keys and removing an unused one): measured Chrome / Edge /
# Firefox 5,170,493 / 5,170,455 / 5,170,720 B on f38cc0fc merged with #685 (Edge on f38cc0fc in
# CI: 5,164,313 B), rounded up with about 2,300 B to spare. ZIP limits unchanged.

[targets.chrome]
zip_bytes = 1_621_000
raw_bytes = 5_173_000

[targets.edge]
zip_bytes = 1_621_000
raw_bytes = 5_173_000

[targets.firefox]
zip_bytes = 1_621_000
raw_bytes = 5_173_000

[categories]
# locales and other raised on 2026-10-15 for the welcome page (welcome.html and its strings in nine
# languages) and the newcomer and permission copy: measured 1,095,791 and 25,837 (Firefox) B, plus
# about 3%. locales raised again on 2026-10-15 for Chrome's built-in AI (its Options states,
# download, onboarding, and popup strings in nine languages): measured 1,147,064 B (1,122,267 on
# a787d2d5), plus about 3%.
javascript = 3_507_000
css = 81_000
fonts = 143_000
locales = 1_182_000
images = 320_000
other = 27_000
