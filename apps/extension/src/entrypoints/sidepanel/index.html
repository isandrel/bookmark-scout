<!doctype html>
<html lang="en" data-surface="compact">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Side Panel - Bookmark Scout</title>
    <!-- Firefox opens an extension sidebar by itself at install unless told not to; the welcome tab
         already greets new users, and Chrome and Edge never open the side panel on their own. -->
    <meta name="manifest.open_at_install" content="false" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png" />
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            min-height: 100vh;
            overflow: hidden;
        }

        #root {
            height: 100%;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
</body>

</html>
