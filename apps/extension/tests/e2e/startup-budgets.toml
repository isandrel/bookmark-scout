# Upper bounds, in KiB, for the JavaScript each page and the background load before any of it
# runs (the entry and every chunk it imports statically). Read by tests/e2e/startup-code.spec.ts;
# every page needs one, and the spec also fails if AI SDK or page-reader code reaches startup.
#
# Policy: every limit sits about 10% above the Chrome build's measurement, so ordinary features fit
# without touching this file; the limits catch a large jump (a heavy module pulled into startup,
# such as React reaching the background), not every kilobyte. When an entry does pass its limit,
# find what grew first (extension-performance, "Find what drags code into an entry"); if the
# growth is meant, re-measure on the branch with main merged in and reset that limit to about 10%
# above, with the reason in the pull request. Never raise one by a KiB or two, which failed the
# next PR in the queue once main was merged into it (October 2026). Earlier limits and their
# reasons are in this file's git history.
#
# Measured 2026-11-02 with the saved search actions on main 237ff13f (Chrome build): background
# 591, popup and side panel 1,158, options 1,417, bookmarks manager 1,635, quick save notification
# 12, agent approval 866, AI host 471, welcome 691. The background grew with the actions registry
# (every feature as an action, which the MCP bridge runs in the service worker); agent approval
# grew with the actions' approval previews. Both limits were reset to about 10% above.
[eager_kib]
"background.js" = 650
"popup.html" = 1260
"sidepanel.html" = 1260
"options.html" = 1500
"bookmarks.html" = 1760
"quick-save-toast.js" = 15
"agent-approval.html" = 950
"ai-host.html" = 510
"welcome.html" = 750
