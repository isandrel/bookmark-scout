# Bookmark Scout project identity, shared by every app and the README.
#
# Read only through `@bookmark-scout/config` (packages/config), which validates it strictly:
# an unknown key or a missing value fails every build. Site-only values (website and docs
# URLs, hosting, analytics) live in config/web.toml.

[project]
name        = "Bookmark Scout"
slug        = "bookmark-scout"
description = "A browser extension that saves pages to the right bookmark folder: type part of a folder's name or let opt-in AI suggest one. Plus search and cleanup tools."

[author]
name = "isandrel"
url  = "https://github.com/isandrel"

[repository]
url            = "https://github.com/isandrel/bookmark-scout"
default_branch = "main"

# `url` is the license text; `file` is the copy in the repository.
[license]
spdx = "AGPL-3.0"
url  = "https://www.gnu.org/licenses/agpl-3.0.html"
file = "LICENSE"

# Language tags (BCP 47, such as zh-CN). `supported` lists the website's and docs' languages,
# which the README links too; `extension` lists the extension's, one per
# apps/extension/public/_locales folder (zh-CN is the folder zh_CN), and may be ahead of the website.
#
# The list order is the display order everywhere: the website and docs language menus, the
# README and CONTRIBUTING switchers, the sitemap's alternates, and the extension's Language
# setting. The rule is most speakers first, with English first as the source language: a new
# language goes in by its speaker count, at the same place in both lists. Approximate total
# speakers (Ethnologue-style 2025 estimates): English ~1.5B; Mandarin (Simplified Chinese) ~1.2B;
# Spanish ~560M; French ~310M; Portuguese ~265M; Russian ~255M; Indonesian ~250M; German ~135M;
# Japanese ~125M; Korean ~82M; Italian ~68M; Traditional Chinese readers (Taiwan and Hong Kong) ~30M.
[locales]
default   = "en"
supported = ["en", "zh-CN", "es", "fr", "pt-BR", "ru", "id", "de", "ja", "ko", "it", "zh-TW"]
extension = ["en", "zh-CN", "es", "fr", "pt-BR", "ru", "id", "de", "ja", "ko", "it", "zh-TW"]

# Each language's own name, for language switchers.
[locales.names]
en = "English"
"zh-CN" = "简体中文"
es = "Español"
fr = "Français"
"pt-BR" = "Português (Brasil)"
ru = "Русский"
id = "Bahasa Indonesia"
de = "Deutsch"
ja = "日本語"
ko = "한국어"
it = "Italiano"
"zh-TW" = "繁體中文"

# Open Graph locale codes.
[locales.og]
en = "en_US"
"zh-CN" = "zh_CN"
es = "es_ES"
fr = "fr_FR"
"pt-BR" = "pt_BR"
ru = "ru_RU"
id = "id_ID"
de = "de_DE"
ja = "ja_JP"
ko = "ko_KR"
it = "it_IT"
"zh-TW" = "zh_TW"

[browsers]
supported = ["chrome", "firefox", "edge"]

[browsers.names]
chrome  = "Chrome"
firefox = "Firefox"
edge    = "Edge"

# Store listings, one per supported browser. Leave `url` empty until that listing is live;
# the website and docs then point to the GitHub release instead.
[stores.chrome]
name = "Chrome Web Store"
url  = "https://chromewebstore.google.com/detail/bookmark-scout/pmjiopaebkmoenkoodpoldfbnfncnedk"

[stores.firefox]
name = "Firefox Add-ons"
url  = ""

[stores.edge]
name = "Microsoft Edge Add-ons"
url  = ""

# Role-based addresses on the site domain (RFC 2142 style). Each one should be an
# alias that forwards to a monitored inbox. Also create postmaster@ and abuse@,
# which mail operators expect but the site does not need to publish.
[contact]
privacy  = "privacy@bookmark-scout.com"
security = "security@bookmark-scout.com"
support  = "support@bookmark-scout.com"

# Dates shown on legal pages (ISO 8601). Update when the policy text changes.
[legal]
privacy_effective_date = "2026-10-23"

# Root Markdown documents generated from templates/ by `bun run generate:markdown`. Each name is
# a file at the root without `.md`. A document has every language in `[locales] supported`
# unless [markdown.languages] lists fewer (the default language is required). The default
# language's copy goes to the root (README.md), the others to <dir>/<tag>/ (i18n/ja/README.md),
# and each template sits at the same path under templates/. The language switcher follows the
# order of `[locales] supported`.
[markdown]
dir       = "i18n"
documents = ["README", "CONTRIBUTING", "DEVELOPMENT"]

# Documents with fewer languages than every supported one.
[markdown.languages]
DEVELOPMENT = ["en"]

# Price for structured data (schema.org Offer).
[offer]
price    = "0"
currency = "USD"
