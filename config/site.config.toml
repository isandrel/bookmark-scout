# Bookmark Scout Configuration
# This file contains site-wide configuration settings.
# Change these values to update the domain/settings across the entire project.

[site]
description = "A browser extension to search, organize, clean up, import/export, and save bookmarks with opt-in AI tools and multi-provider support."
meta_title  = "Browser Bookmark Manager"
name        = "Bookmark Scout"
url         = "https://bookmark-scout.com"

[author]
name = "isandrel"
url  = "https://github.com/isandrel"

[github]
url = "https://github.com/isandrel/bookmark-scout"

[license]
name = "AGPL-3.0"
url  = "https://github.com/isandrel/bookmark-scout/blob/main/LICENSE"

[locales]
default   = "en"
supported = ["en", "ja", "ko"]

# Role-based addresses on the site domain (RFC 2142 style). Each one should be an
# alias that forwards to a monitored inbox. Also create postmaster@ and abuse@,
# which mail operators expect but the site does not need to publish.
[contact]
privacy  = "privacy@bookmark-scout.com"
security = "security@bookmark-scout.com"
support  = "support@bookmark-scout.com"

# Store listing URLs. Leave a value empty until that listing is live; the site then
# shows the GitHub release download instead of a store link.
[stores]
chrome_web_store = ""
edge_addons      = ""
firefox_addons   = ""

# Dates shown on legal pages (ISO 8601). Update when the policy text changes.
[legal]
privacy_effective_date = "2026-10-02"

[docs]
name = "Bookmark Scout Docs"
url  = "https://docs.bookmark-scout.com"

# =============================================================================
# Analytics (Umami Cloud)
# Each site has its own analytics configuration
# =============================================================================

# Analytics for bookmark-scout.com (main website)
[analytics.website]
enabled    = true
provider   = "umami"
script_url = "https://cloud.umami.is/script.js"
website_id = "878e552a-c74d-4ebf-b101-398993c55023"

# Analytics for docs.bookmark-scout.com
# Uncomment and configure when ready
# [analytics.docs]
# enabled    = false
# provider   = "umami"
# script_url = "https://cloud.umami.is/script.js"
# website_id = ""
