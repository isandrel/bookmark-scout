name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    # Skip greeting for bot accounts
    if: github.actor != 'dependabot[bot]' && github.actor != 'github-actions[bot]'
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v3
        continue-on-error: true
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: |
            👋 Welcome to **Bookmark Scout**! Thanks for opening your first issue!

            We appreciate you taking the time to report this. Here's what happens next:
            - A maintainer will review your issue and may ask for more details
            - Please check if there are any similar issues already open
            - Feel free to submit a PR if you'd like to contribute a fix!

            📚 Check out our [Contributing Guide](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.repository.default_branch }}/CONTRIBUTING.md) for more info.
          pr_message: |
            🎉 Welcome to **Bookmark Scout**! Thanks for your first contribution!

            We're excited to review your pull request. Here's what to expect:
            - CI checks will run automatically
            - A maintainer will review your changes
            - Please ensure all checks pass before requesting review

            📚 Check out our [Contributing Guide](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.repository.default_branch }}/CONTRIBUTING.md) for best practices.

            Thanks for helping make Bookmark Scout better! 🚀
