name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Decides which jobs a pull request needs. Required checks still report: a job skipped by its
  # `if` counts as passed. Pushes to main always run everything.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      extension: ${{ steps.filter.outputs.extension }}
      sites: ${{ steps.filter.outputs.sites }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Match changed paths
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          NOTES: '(^|/)(AGENTS|DESIGN|README|CONTRIBUTING|CHANGELOG)\.md$'
          # Files every app depends on: workspace setup, shared packages and config, and CI itself.
          SHARED: '^(package\.json|bun\.lock|nx\.json|biome\.json|tsconfig[^/]*\.json|packages/|config/|\.github/workflows/ci\.yml)'
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "extension=true" >> "$GITHUB_OUTPUT"
            echo "sites=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Agent, design, and readme notes build nothing; Lint still checks the generated READMEs.
          changed=$(git diff --name-only "$BASE"...HEAD | grep -Ev "$NOTES" || true)
          printf 'Changed files that need checks:\n%s\n' "$changed"
          matches() { printf '%s\n' "$changed" | grep -Eq "$1" && echo true || echo false; }
          echo "extension=$(matches "^apps/extension/|$SHARED")" >> "$GITHUB_OUTPUT"
          echo "sites=$(matches "^apps/(website|docs)/|$SHARED")" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run lint
        run: bunx nx run extension:lint

      - name: Check generated READMEs match templates
        run: |
          bun run generate:readme
          git diff --exit-code -- README.md translations/ || {
            echo "::error::README files differ from templates/. Edit templates/*.md, run 'bun run generate:readme', and commit both."
            exit 1
          }

  build:
    name: Build Extension
    runs-on: ubuntu-latest
    needs: [lint, changes]
    strategy:
      matrix:
        target: [chrome, firefox, edge]
    # Conditions are per step, not on the job: a skipped matrix job would report one unnamed
    # check instead of "Build Extension (chrome)" and the others the ruleset requires.
    env:
      RUN: ${{ needs.changes.outputs.extension }}
    steps:
      - name: Skip, the extension is unchanged
        if: env.RUN != 'true'
        run: echo "No extension changes in this pull request."

      - name: Checkout
        if: env.RUN == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        if: env.RUN == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        if: env.RUN == 'true'
        run: bun install

      - name: Build for ${{ matrix.target }}
        if: env.RUN == 'true'
        run: |
          if [ "${{ matrix.target }}" = "chrome" ]; then
            bunx nx run extension:build:chrome
          elif [ "${{ matrix.target }}" = "firefox" ]; then
            bunx nx run extension:build:firefox
          else
            bunx nx run extension:build:edge
          fi

  test:
    name: Extension Tests
    runs-on: ubuntu-latest
    needs: [lint, changes]
    if: needs.changes.outputs.extension == 'true'
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit and browser tests
        run: bun run test

      - name: Upload browser test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failures
          path: |
            apps/extension/test-results/playwright/**/trace.zip
            apps/extension/test-results/playwright/**/*.png
            apps/extension/test-results/playwright/**/error-context.md
          if-no-files-found: ignore
          retention-days: 7

  # Runtime coverage beyond Chromium. Required by the main branch ruleset; see
  # apps/docs/content/docs/status.mdx for what each browser runs.
  e2e-edge:
    name: Edge E2E
    runs-on: ubuntu-latest
    needs: [lint, changes]
    if: needs.changes.outputs.extension == 'true'
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Ensure Microsoft Edge
        run: |
          if ! command -v microsoft-edge >/dev/null; then
            bunx playwright install --with-deps msedge
          fi
          microsoft-edge --version

      - name: Run the browser suite in Edge
        run: bunx nx run extension:test:e2e:edge

      - name: Upload browser test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failures-edge
          path: |
            apps/extension/test-results/playwright/**/trace.zip
            apps/extension/test-results/playwright/**/*.png
            apps/extension/test-results/playwright/**/error-context.md
          if-no-files-found: ignore
          retention-days: 7

  e2e-firefox:
    name: Firefox E2E smoke
    runs-on: ubuntu-latest
    needs: [lint, changes]
    if: needs.changes.outputs.extension == 'true'
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Show Firefox and geckodriver versions
        run: |
          firefox --version
          geckodriver --version | head -1 || echo "geckodriver not preinstalled; Selenium Manager downloads it"

      - name: Run the Firefox smoke suite
        run: bunx nx run extension:test:e2e:firefox

      - name: Upload browser test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failures-firefox
          path: |
            apps/extension/test-results/playwright/**/*.png
            apps/extension/test-results/playwright/**/error-context.md
          if-no-files-found: ignore
          retention-days: 7

  # Marketing site and docs: build checks and browser tests. Required by the main branch ruleset.
  sites:
    name: Website and Docs
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.sites == 'true'
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint website
        run: bunx nx run website:lint

      - name: Build and verify website
        run: bunx nx run website:verify

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Website browser tests
        run: bunx nx run website:test:e2e

      - name: Type-check docs
        run: bunx nx run docs:types:check

      - name: Build docs
        run: bunx nx run docs:build

      - name: Verify docs build
        run: bun run --cwd apps/docs verify

      - name: Upload website test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failures-website
          path: |
            apps/website/test-results/playwright/**/trace.zip
            apps/website/test-results/playwright/**/*.png
          if-no-files-found: ignore
          retention-days: 7
