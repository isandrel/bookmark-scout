name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a pull request cancels its older run. Every other event gets its own group, so
# no run on main is cancelled or replaced while it waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job checks out the repository, then runs .github/actions/setup-workspace (Bun from
# `packageManager` in package.json, `bun install --frozen-lockfile`). Job names are the required
# checks of the main branch ruleset: renaming one blocks merges until the ruleset is updated.
# The browser suites run as matrix shards; "Extension Tests" and "Edge E2E" are summary jobs
# that keep the required check names and fail unless every shard passed.
jobs:
  # Decides which jobs a pull request needs, from the rules in .github/ci-scopes.toml. Required
  # checks still report: a job skipped by its `if` counts as passed. Pushes to main run everything.
  # Dependent jobs use `!cancelled()`, so a failure here never skips them; with no output, their
  # `if` fails to evaluate, which fails the check instead of passing it.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      scopes: ${{ steps.scopes.outputs.scopes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          install: "false"

      - name: Match changed files to scopes
        id: scopes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git diff --name-only "$BASE"...HEAD | tee /dev/stderr > changed.txt
            # If the rules cannot be read, run everything rather than skip anything.
            scopes=$(bun scripts/ci-scopes.ts < changed.txt) || scopes=$(bun scripts/ci-scopes.ts --all)
          else
            scopes=$(bun scripts/ci-scopes.ts --all)
          fi
          echo "Scopes: $scopes"
          echo "scopes=$scopes" >> "$GITHUB_OUTPUT"

      # After the output is set, so a failing rule test still lets the other jobs run.
      - name: Test the scope rules
        run: bun test scripts/ci-scopes.test.ts

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Run lint
        run: bunx nx run extension:lint

      - name: Type-check the extension
        run: bunx nx run extension:typecheck

      - name: Test the workspace config and scripts
        run: bun test packages scripts apps/website/lib

      - name: Check generated READMEs match templates
        run: |
          bun run generate:readme
          git diff --exit-code -- README.md translations/ || {
            echo "::error::README files differ from their inputs (templates/, config/, installed package versions). Run 'bun run generate:readme' and commit the result."
            exit 1
          }

  build:
    name: Build Extension
    runs-on: ubuntu-latest
    needs: [lint, changes]
    if: ${{ !cancelled() && needs.lint.result == 'success' }}
    strategy:
      matrix:
        target: [chrome, firefox, edge]
    # Conditions are per step, not on the job: a skipped matrix job would report one unnamed
    # check instead of "Build Extension (chrome)" and the others the ruleset requires.
    env:
      RUN: ${{ fromJSON(needs.changes.outputs.scopes).extension }}
    steps:
      - name: Skip, the extension is unchanged
        if: env.RUN != 'true'
        run: echo "No extension changes in this pull request."

      - name: Checkout
        if: env.RUN == 'true'
        uses: actions/checkout@v7

      - name: Set up workspace
        if: env.RUN == 'true'
        uses: ./.github/actions/setup-workspace

      - name: Build for ${{ matrix.target }}
        if: env.RUN == 'true'
        run: bunx nx run extension:build:${{ matrix.target }}

  # The browser suites do not wait for Lint: it is a required check of its own, and starting them
  # at once takes Lint off the critical path.
  unit:
    name: Extension Unit Tests
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && fromJSON(needs.changes.outputs.scopes).extension }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Run unit tests
        run: bunx nx run extension:test:unit

  # Shards split the suite by test (`fullyParallel`), and each shard runs the worker count from
  # apps/extension/playwright.config.ts. Change the shard count here only; the total is read from
  # the matrix size.
  e2e-chromium:
    name: Chromium E2E (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && fromJSON(needs.changes.outputs.scopes).extension }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Run browser test shard ${{ matrix.shard }}
        run: bunx nx run extension:test:e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload browser test diagnostics
        if: failure()
        uses: ./.github/actions/upload-playwright-failures
        with:
          app: extension
          name: playwright-failures-chromium-${{ matrix.shard }}

  # Required check: the unit tests and every Chromium shard.
  test:
    name: Extension Tests
    runs-on: ubuntu-latest
    needs: [changes, unit, e2e-chromium]
    if: ${{ always() }}
    steps:
      - name: Checkout the CI actions
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions

      - name: Require every job to pass
        uses: ./.github/actions/require-jobs
        with:
          needs: ${{ toJSON(needs) }}
          scope: extension

  # Runtime coverage beyond Chromium, sharded like the Chromium suite; see
  # apps/docs/content/docs/status.mdx for what each browser runs.
  e2e-edge-shard:
    name: Edge E2E (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && fromJSON(needs.changes.outputs.scopes).extension }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Ensure Microsoft Edge
        run: |
          if ! command -v microsoft-edge >/dev/null; then
            bunx playwright install --with-deps msedge
          fi
          microsoft-edge --version

      - name: Run browser test shard ${{ matrix.shard }} in Edge
        run: bunx nx run extension:test:e2e:edge -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload browser test diagnostics
        if: failure()
        uses: ./.github/actions/upload-playwright-failures
        with:
          app: extension
          name: playwright-failures-edge-${{ matrix.shard }}

  # Required check: every Edge shard.
  e2e-edge:
    name: Edge E2E
    runs-on: ubuntu-latest
    needs: [changes, e2e-edge-shard]
    if: ${{ always() }}
    steps:
      - name: Checkout the CI actions
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions

      - name: Require every shard to pass
        uses: ./.github/actions/require-jobs
        with:
          needs: ${{ toJSON(needs) }}
          scope: extension

  e2e-firefox:
    name: Firefox E2E smoke
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && fromJSON(needs.changes.outputs.scopes).extension }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Show Firefox and geckodriver versions
        run: |
          firefox --version
          geckodriver --version | head -1 || echo "geckodriver not preinstalled; Selenium Manager downloads it"

      - name: Run the Firefox smoke suite
        run: bunx nx run extension:test:e2e:firefox

      - name: Upload browser test diagnostics
        if: failure()
        uses: ./.github/actions/upload-playwright-failures
        with:
          app: extension
          name: playwright-failures-firefox

  # Marketing site and docs: build checks and browser tests. Required by the main branch ruleset.
  sites:
    name: Website and Docs
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && fromJSON(needs.changes.outputs.scopes).sites }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Lint website
        run: bunx nx run website:lint

      - name: Build and verify website
        run: bunx nx run website:verify

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps --only-shell chromium

      - name: Website browser tests
        run: bunx nx run website:test:e2e

      - name: Type-check docs
        run: bunx nx run docs:types:check

      - name: Lint docs
        working-directory: apps/docs
        run: bunx biome check src scripts

      - name: Build and verify docs
        run: bunx nx run docs:verify

      - name: Upload website test diagnostics
        if: failure()
        uses: ./.github/actions/upload-playwright-failures
        with:
          app: website
          name: playwright-failures-website
