name: Performance

# Latency and scrolling measurements of the extension on a large library (apps/extension/tests/perf).
# Not a pull request check: timings vary between runners, so a slow run is reported here and fixed
# in a follow-up rather than blocking unrelated merges. Run it by hand to measure a branch.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  perf:
    name: Extension performance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Install Chromium
        working-directory: apps/extension
        run: bunx playwright install --with-deps --no-shell chromium

      - name: Measure
        run: bunx nx run extension:test:perf

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: perf-report
          path: apps/extension/test-results/perf/*.json
          if-no-files-found: ignore
          retention-days: 30
