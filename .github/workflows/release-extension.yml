name: Release Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get version from tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      # WXT writes the manifest version from apps/extension/package.json.
      - name: Verify tag matches extension version
        run: |
          expected="v$(jq -r .version apps/extension/package.json)"
          if [ "${{ steps.get_version.outputs.version }}" != "$expected" ]; then
            echo "::error::Tag ${{ steps.get_version.outputs.version }} does not match apps/extension/package.json ($expected)"
            exit 1
          fi

      # wxt zip builds each target and writes bookmark-scout-<tag>-<browser>.zip to dist/.
      # The Firefox run also writes bookmark-scout-<tag>-sources.zip for add-on review.
      - name: Build and zip extension
        run: bun run zip
        working-directory: ./apps/extension

      - name: Build Chrome CRX
        uses: cardinalby/webext-buildtools-chrome-crx-action@v2
        with:
          zipFilePath: apps/extension/dist/bookmark-scout-${{ steps.get_version.outputs.version }}-chrome.zip
          crxFilePath: apps/extension/dist/bookmark-scout-${{ steps.get_version.outputs.version }}-chrome.crx
          privateKey: ${{ secrets.CRX_PRIVATE_KEY }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Bookmark Scout ${{ steps.get_version.outputs.version }}
          body: |
            ## 📦 Downloads

            | Browser | File | Description |
            |---------|------|-------------|
            | Chrome | `bookmark-scout-${{ steps.get_version.outputs.version }}-chrome.crx` | Signed extension (sideload) |
            | Chrome | `bookmark-scout-${{ steps.get_version.outputs.version }}-chrome.zip` | For Chrome Web Store |
            | Firefox | `bookmark-scout-${{ steps.get_version.outputs.version }}-firefox.zip` | For Firefox Add-ons |
            | Edge | `bookmark-scout-${{ steps.get_version.outputs.version }}-edge.zip` | For Edge Add-ons |
            | Source | `bookmark-scout-${{ steps.get_version.outputs.version }}-sources.zip` | Source code for Firefox Add-ons review |

            ## Installation

            ### Chrome (CRX - Developer Mode)
            1. Download `bookmark-scout-chrome.crx`
            2. Open `chrome://extensions/`
            3. Enable "Developer mode"
            4. Drag and drop the `.crx` file

            ### Firefox
            1. Download `bookmark-scout-firefox.zip`
            2. Open `about:debugging#/runtime/this-firefox`
            3. Click "Load Temporary Add-on"
            4. Select the zip file

            ### Edge
            1. Download `bookmark-scout-edge.zip`
            2. Open `edge://extensions/`
            3. Enable "Developer mode"
            4. Click "Load unpacked" and select the extracted folder
          files: |
            apps/extension/dist/bookmark-scout-${{ steps.get_version.outputs.version }}-chrome.crx
            apps/extension/dist/bookmark-scout-${{ steps.get_version.outputs.version }}-chrome.zip
            apps/extension/dist/bookmark-scout-${{ steps.get_version.outputs.version }}-firefox.zip
            apps/extension/dist/bookmark-scout-${{ steps.get_version.outputs.version }}-edge.zip
            apps/extension/dist/bookmark-scout-${{ steps.get_version.outputs.version }}-sources.zip
          generate_release_notes: true
          draft: false
          prerelease: false
