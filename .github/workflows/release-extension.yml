name: Release Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Get version from tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      # WXT writes the manifest version from apps/extension/package.json.
      - name: Verify tag matches extension version
        run: |
          expected="v$(jq -r .version apps/extension/package.json)"
          if [ "${{ steps.get_version.outputs.version }}" != "$expected" ]; then
            echo "::error::Tag ${{ steps.get_version.outputs.version }} does not match apps/extension/package.json ($expected)"
            exit 1
          fi

      # `wxt zip` names the files from the zip templates in apps/extension/wxt.config.ts: one zip
      # per browser plus, from the Firefox run, the sources zip for add-on review. Nothing below
      # repeats those names; each step finds the files in dist/.
      - name: Build and zip extension
        run: bun run zip
        working-directory: ./apps/extension

      - name: Find the Chrome zip
        id: chrome
        run: |
          zip=$(ls apps/extension/dist/*-chrome.zip)
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "crx=${zip%.zip}.crx" >> "$GITHUB_OUTPUT"

      - name: Build Chrome CRX
        uses: cardinalby/webext-buildtools-chrome-crx-action@v2
        with:
          zipFilePath: ${{ steps.chrome.outputs.zip }}
          crxFilePath: ${{ steps.chrome.outputs.crx }}
          privateKey: ${{ secrets.CRX_PRIVATE_KEY }}

      - name: Read release links from config
        id: links
        run: |
          # shellcheck disable=SC2016 # the backticks are a JavaScript template literal
          bun -e 'import { site } from "@bookmark-scout/config";
            console.log(`name=${site.name}`);
            console.log(`install=${site.docs.url("/installation")}`);' >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: ${{ steps.links.outputs.name }} ${{ steps.get_version.outputs.version }}
          body: |
            ## 📦 Downloads

            | Browser | File ends with | Use |
            |---------|----------------|-----|
            | Chrome | `-chrome.crx` | Signed extension to sideload in developer mode |
            | Chrome | `-chrome.zip` | Unpacked install, or the Chrome Web Store upload |
            | Firefox | `-firefox.zip` | Temporary add-on, or the Firefox Add-ons upload |
            | Edge | `-edge.zip` | Unpacked install, or the Edge Add-ons upload |
            | Source | `-sources.zip` | Source code for Firefox Add-ons review |

            ## Installation

            Step-by-step instructions for each browser: ${{ steps.links.outputs.install }}
          files: |
            apps/extension/dist/*.zip
            apps/extension/dist/*.crx
          generate_release_notes: true
          draft: false
          prerelease: false
