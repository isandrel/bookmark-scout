name: Deploy Website to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/website/**"
      - "config/**"
      - "packages/config/**"
      # The website lists the AI providers from the extension's config.
      - "apps/extension/config/**"
      - "bun.lock"
      - "package.json"
      - ".github/actions/setup-workspace/**"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      contents: read
      deployments: write
    with:
      app: website
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME_WEBSITE }}
