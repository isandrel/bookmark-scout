name: Deploy Website to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/website/**"
      - "config/**"
      - "packages/config/**"
      - "bun.lock"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and verify website
        run: bunx nx run website:verify
        env:
          NODE_ENV: production

      # First deploy only: the project must exist before `pages deploy`. Fails harmlessly once it does.
      - name: Create Cloudflare Pages project if missing
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ secrets.CLOUDFLARE_PROJECT_NAME_WEBSITE }} --production-branch=main

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/website/out --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME_WEBSITE }} --branch=${{ github.ref_name }}

      - name: Attach custom domains
        if: github.ref_name == 'main'
        working-directory: apps/website
        run: bun scripts/attach-domains.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME_WEBSITE }}
