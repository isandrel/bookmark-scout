name: Deploy Docs to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "config/**"
      - "packages/config/**"
      - "bun.lock"
      - "package.json"
      - ".github/actions/setup-workspace/**"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      contents: read
      deployments: write
    with:
      app: docs
      # Full history, so each page's "Last updated" date and sitemap lastmod come from git.
      fetch-depth: 0
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME_DOCS }}
