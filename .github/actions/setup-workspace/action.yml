name: Set up workspace
description: >-
  Installs the Bun version pinned by `packageManager` in package.json and, unless turned off,
  the workspace dependencies from bun.lock. Run actions/checkout first: a local action is
  read from the checked-out repository.

inputs:
  install:
    description: Install dependencies with `bun install --frozen-lockfile`.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: bun install --frozen-lockfile
